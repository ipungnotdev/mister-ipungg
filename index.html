<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --border:rgba(155,48,255,.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Rajdhani,sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-family:Orbitron;
  color:var(--neon);
  font-weight:800;
}

.hamburger{
  width:42px;height:42px;
  border:none;
  border-radius:10px;
  background:rgba(155,48,255,.15);
  color:white;
  font-size:20px;
}

/* SIDE MENU */
.side-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;
}
.side-overlay.open{opacity:1;pointer-events:auto}

.side-menu{
  position:fixed;
  right:-300px;top:0;
  width:280px;height:100%;
  background:#090312;
  transition:.3s;
}
.side-menu.open{right:0}

/* BANNER */
.banner-wrap img,.banner-wrap video{
  width:100%;
  max-height:240px;
  object-fit:cover;
}

/* CATEGORY */
.cat-scroll{
  display:flex;
  overflow:auto;
  gap:10px;
  padding:10px;
}

.cat-btn{
  padding:10px 16px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  white-space:nowrap;
}
.cat-btn.active{
  background:var(--purple);
}

/* PRODUCT */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.product img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.product-info{
  padding:10px;
}

button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:360px;
  background:var(--card);
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0d0820;
  color:white;
}

.qris{
  width:180px;
  display:block;
  margin:10px auto;
  border-radius:10px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <div class="logo" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu"></div>

<!-- BANNER -->
<div class="banner-wrap" id="banner"></div>

<!-- CATEGORY -->
<div class="cat-scroll" id="cat"></div>

<!-- PRODUCT -->
<div class="products" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>ORDER</h3>
    <div id="pname"></div>
    <div id="pprice"></div>
    <input id="nama" placeholder="Nama">
    <button onclick="toPay()">LANJUT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <h3>PAYMENT</h3>

    <img class="qris" src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg">

    <a href="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" download>
      DOWNLOAD
    </a>

    <input type="file" id="proof">

    <button onclick="send()">KIRIM BUKTI</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9...",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

let data={},selected={},namaUser="";

onValue(ref(db,"store"),snap=>{
  data=snap.val()||{};
  render();
});

function render(){

  document.getElementById("storeName").innerText=
  data.settings?.storeName||"IPUNGG SHOP";

  const b=document.getElementById("banner");
  const bn=data.settings?.banner;

  b.innerHTML=bn?.includes("mp4")
  ?`<video autoplay muted loop src="${bn}"></video>`
  :`<img src="${bn}">`;

  const cats=Object.values(data.categories||{});
  document.getElementById("cat").innerHTML=
  `<button class="cat-btn active">ALL</button>`+
  cats.map(c=>`<button class="cat-btn">${c.name}</button>`).join("");

  const prods=Object.values(data.products||{});
  document.getElementById("products").innerHTML=
  prods.map(p=>`
    <div class="product">
      <img src="${p.thumbnail}">
      <div class="product-info">
        <b>${p.name}</b>
        <div>Rp ${Number(p.price).toLocaleString()}</div>
        <button onclick='openOrder(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join("");
}

window.openOrder=(p)=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=p.price;
  document.getElementById("orderBox").classList.add("show");
}

window.toPay=()=>{
  namaUser=document.getElementById("nama").value;
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
}

window.send=async()=>{
  const file=document.getElementById("proof").files[0];
  const fd=new FormData();
  fd.append("image",file);

  const r=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const d=await r.json();

  const img=d.data.url;

  const msg=encodeURIComponent(
`🛒 ORDER BARU

Nama : ${namaUser}
Tanggal : ${new Date().toLocaleDateString("id-ID")}
Payment : QRIS ONLY

📸 Bukti:
${img}`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
};

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
};

/* FIX BACK BUTTON ANTI EXIT */
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  ["menu","orderBox","payBox"].forEach(id=>{
    document.getElementById(id)?.classList.remove("open","show");
  });
  history.pushState(null,null,location.href);
});
</script>

</body>
                                   </html>
