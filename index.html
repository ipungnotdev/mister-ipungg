<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --cyan:#00f5ff;
  --border:rgba(155,48,255,0.25);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAVBAR */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
  font-family:'Orbitron';
  color:var(--neon);
}

.hamburger{
  font-size:22px;
  background:transparent;
  border:none;
  color:var(--neon);
  cursor:pointer;
}

/* SIDE MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.side-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:260px;
  height:100%;
  background:#0b0618;
  border-left:1px solid var(--border);
  transition:.3s;
  z-index:2000;
}

.side-menu.open{right:0}

.side-header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.side-links a{
  display:block;
  padding:14px;
  margin:10px;
  background:rgba(155,48,255,0.08);
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  text-decoration:none;
}

/* BANNER */
.banner img, .banner video{
  width:100%;
  max-height:260px;
  object-fit:cover;
}

/* CATEGORY */
.section{padding:16px}

.section-title{
  color:var(--cyan);
  font-size:12px;
  margin-bottom:10px;
  letter-spacing:2px;
}

.cat-wrap{
  display:flex;
  gap:10px;
  overflow:auto;
}

.cat-card{
  min-width:130px;
  padding:16px;
  border-radius:16px;
  background:linear-gradient(135deg,#1a0933,#0b0618);
  border:1px solid var(--border);
  cursor:pointer;
  transition:.3s;
  text-align:center;
}

.cat-card:hover{
  transform:scale(1.08);
  box-shadow:0 0 20px var(--purple);
}

/* PRODUCTS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.price{
  color:var(--cyan);
  font-weight:bold;
}

.btn{
  width:100%;
  padding:8px;
  margin-top:8px;
  border:none;
  background:linear-gradient(135deg,var(--purple),#5b00cc);
  color:white;
  border-radius:10px;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
  z-index:3000;
}

.overlay.show{display:flex}

.box{
  width:90%;
  max-width:380px;
  background:#0b0618;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
}

.input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:#120a25;
  color:white;
}

/* PAYMENT */
.qr{
  width:200px;
  display:block;
  margin:10px auto;
  border-radius:12px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  padding:10px 20px;
  border-radius:20px;
  display:none;
  color:white;
}

.toast.show{display:block}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">⚡ IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<!-- MENU -->
<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu">
  <div class="side-header">
    <b>MENU</b>
    <button onclick="toggleMenu()">✕</button>
  </div>
  <div class="side-links">
    <a id="wa" target="_blank">WhatsApp Admin</a>
    <a id="group" target="_blank">Grup</a>
    <a id="channel" target="_blank">Channel</a>
  </div>
</div>

<!-- BANNER -->
<div class="banner" id="banner"></div>

<!-- CATEGORY -->
<div class="section">
  <div class="section-title">CATEGORY</div>
  <div class="cat-wrap" id="cats"></div>
</div>

<!-- PRODUCTS -->
<div class="grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>ORDER</h3>
    <div id="pname"></div>
    <div id="pprice" class="price"></div>

    <input class="input" id="name" placeholder="Nama">
    <input class="input" id="date" readonly>

    <button class="btn" onclick="next()">Lanjut</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <h3>PAYMENT</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qr">

    <input type="file" class="input" id="proof">

    <button class="btn" onclick="send()">Kirim</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

let data={}, selected={};

onValue(ref(db,"store"),snap=>{
  data = snap.val()||{};
  render();
});

function render(){

  // banner
  const b=document.getElementById("banner");
  if(data.settings?.banner?.includes(".mp4")){
    b.innerHTML=`<video autoplay muted loop src="${data.settings.banner}"></video>`;
  }else{
    b.innerHTML=`<img src="${data.settings?.banner||''}">`;
  }

  // cats
  const c=document.getElementById("cats");
  c.innerHTML="";
  Object.values(data.categories||{}).forEach(cat=>{
    c.innerHTML+=`<div class="cat-card" onclick="filter('${cat.name}')">${cat.name}</div>`;
  });

  // products
  window.products = Object.values(data.products||{});
  show(products);
}

window.filter=(c)=>{
  show(products.filter(p=>p.category===c));
}

function show(list){
  const g=document.getElementById("products");
  g.innerHTML=list.map(p=>`
    <div class="card">
      <img src="${p.thumbnail||''}">
      <div class="card-body">
        <b>${p.name}</b>
        <div class="price">Rp ${Number(p.price).toLocaleString()}</div>
        <button class="btn" onclick='order(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.order=(p)=>{
  selected=p;
  document.getElementById("orderBox").classList.add("show");
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=p.price;
  document.getElementById("date").value=new Date().toLocaleDateString();
  history.pushState({},'');
}

window.next=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
  history.pushState({},'');
}

window.send=()=>{
  const name=document.getElementById("name").value;
  const msg=encodeURIComponent(
`ORDER BARU

Nama: ${name}
Tanggal: ${new Date().toLocaleDateString()}
Payment: Online Payment
Produk: ${selected.name}
Harga: ${selected.price}`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}

// FIX BACK BUTTON GA KELUAR WEB
window.addEventListener("popstate",()=>{
  document.getElementById("menu").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
  history.pushState({},'');
});

function toast(t){
  const el=document.getElementById("toast");
  el.innerText=t;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2000);
}

history.pushState({},'');
</script>

</body>
      </html>
