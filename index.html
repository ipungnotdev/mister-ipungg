<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --bg2:#0a0520;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:9999;
  background:#070312;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:800;
}

.hamburger{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:rgba(155,48,255,.15);
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:10000;
}

/* SIDE MENU FIX */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:9998;
}
.side-overlay.open{opacity:1;pointer-events:auto;}

.side-menu{
  position:fixed;
  top:0;
  right:-300px;
  width:280px;
  height:100%;
  background:#090312;
  transition:.3s;
  z-index:9999;
}
.side-menu.open{right:0;}

.side-links a{
  display:block;
  padding:14px;
  margin:10px;
  border-radius:12px;
  background:rgba(155,48,255,.08);
  color:white;
  text-decoration:none;
}

/* BANNER */
.banner-wrap img,
.banner-wrap video{
  width:100%;
  max-height:250px;
  object-fit:cover;
}

/* CATEGORY TEXT CARD */
.cat-cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:12px;
}

.cat-card{
  min-width:150px;
  height:110px;
  background:linear-gradient(135deg,rgba(155,48,255,.18),rgba(0,245,255,.06));
  border:1px solid rgba(155,48,255,.3);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  cursor:pointer;
  transition:.25s;
  font-size:14px;
}

.cat-card:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px rgba(155,48,255,.5);
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{padding:12px;}

.btn-order{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* OVERLAY FIX CLICK */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10000;
}
.overlay.show{display:flex;}

.overlay-box{
  width:90%;
  max-width:400px;
  background:var(--bg2);
  padding:20px;
  border-radius:16px;
}

.qris-img{
  width:200px;
  margin:15px auto;
  display:block;
}

.form-input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  padding:12px 20px;
  border-radius:30px;
  color:white;
  display:none;
  z-index:10001;
}
.toast.show{display:block;}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<div class="side-overlay" id="sideOverlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
  <div class="side-links">
    <a id="linkWa" target="_blank">WhatsApp</a>
    <a id="linkGroup" target="_blank">Grup</a>
    <a id="linkChannel" target="_blank">Channel</a>
  </div>
</div>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="cat-cards" id="catCards"></div>

<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">
    <h3>ORDER</h3>

    <div id="selProdName"></div>
    <div id="selProdPrice"></div>

    <input class="form-input" id="orderName" placeholder="Nama">
    <input class="form-input" id="orderDate" readonly>
    <input class="form-input" value="QRIS ONLY" readonly>

    <button class="btn-primary" onclick="submitOrder()">KIRIM ADMIN</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">
    <h3>PAYMENT QRIS</h3>

    <img src="URL_QRIS_KAMU" class="qris-img">

    <input type="file" id="paymentProof" class="form-input">

    <button class="btn-primary" onclick="sendPaymentProof()">KIRIM ADMIN</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

window._data = {};

onValue(ref(db,"store"),(snap)=>{
  const d = snap.val()||{};
  window._data = d;

  document.getElementById("storeName").textContent = d.settings?.storeName || "IPUNGG SHOP";

  renderCats(d.categories||{});
  renderProds(d.products||{});
  renderBanner(d.settings?.banner||"");

  document.getElementById("linkWa").href="https://wa.me/"+(d.settings?.urlAdmin||"");
  document.getElementById("linkGroup").href=d.settings?.urlGroup||"#";
  document.getElementById("linkChannel").href=d.settings?.urlChannel||"#";
});

function renderBanner(b){
  const el=document.getElementById("bannerWrap");
  el.innerHTML=b?`<img src="${b}">`:"";
}

function renderCats(cats){
  const el=document.getElementById("catCards");
  el.innerHTML=Object.values(cats).map(c=>
    `<div class="cat-card" onclick="filterCat('${c.name}')">${c.name}</div>`
  ).join('');
}

window.filterCat=function(cat){
  renderProds(window._data.products,cat);
};

function renderProds(p,c="all"){
  const el=document.getElementById("productsGrid");
  let arr=Object.values(p||{});
  if(c!=="all")arr=arr.filter(x=>x.category===c);

  el.innerHTML=arr.map(x=>`
    <div class="product-card">
      <img class="prod-thumb" src="${x.thumbnail||''}">
      <div class="prod-info">
        <b>${x.name}</b><br>
        Rp ${Number(x.price).toLocaleString('id-ID')}
        <button class="btn-order" onclick='openOrder(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.openOrder=function(p){
  window._p=p;
  document.getElementById("orderOverlay").classList.add("show");
  document.getElementById("selProdName").innerText=p.name;
  document.getElementById("selProdPrice").innerText=p.price;
};

window.submitOrder=function(){
  const name=document.getElementById("orderName").value;
  window._name=name;
  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");
};

window.sendPaymentProof=async function(){
  const file=document.getElementById("paymentProof").files[0];

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const json=await res.json();

  const img=json.data.url;

  const msg=encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

📦 Produk  : ${window._p.name}
💰 Harga   : Rp ${Number(window._p.price).toLocaleString('id-ID')}
👤 Nama    : ${window._name}

💳 Payment : QRIS ONLY
📸 Bukti:
${img}`
  );

  window.open("https://wa.me/"+window._data.settings.urlAdmin+"?text="+msg);
};

window.toggleMenu=function(){
  document.getElementById("sideMenu").classList.toggle("open");
  document.getElementById("sideOverlay").classList.toggle("open");
};

window.showToast=function(t){
  const el=document.getElementById("toast");
  el.textContent=t;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2000);
};
</script>

</body>
  </html>
