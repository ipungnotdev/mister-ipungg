<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --bg2:#0a0520;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  position:sticky;
  top:0;
  background:#070312;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
}

.hamburger{
  background:transparent;
  border:1px solid var(--border);
  color:var(--neon);
  width:40px;
  height:40px;
  border-radius:10px;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:12px;
  overflow:auto;
  padding:10px 16px;
}

.cat-card{
  min-width:130px;
  height:90px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(155,48,255,.15),rgba(0,245,255,.08));
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  transition:.3s;
}

.cat-card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 20px rgba(155,48,255,.4);
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.prod-info{padding:10px}

.btn-order{
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,var(--purple),#6b00cc);
  border:none;
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.8);
}

.overlay.show{display:flex}

.overlay-box{
  width:90%;
  max-width:400px;
  background:var(--bg2);
  padding:20px;
  border-radius:20px;
  border:1px solid var(--border);
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0d0820;
  color:white;
}

.btn-primary{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  border:none;
  color:white;
  font-weight:700;
  border-radius:10px;
}

.qris-img{
  width:200px;
  display:block;
  margin:10px auto;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  padding:10px 20px;
  border-radius:30px;
  display:none;
}
.toast.show{display:block}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-name">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<!-- CATEGORY -->
<div class="cat-cards" id="catCards"></div>

<!-- PRODUCTS -->
<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">
    <h3>ORDER</h3>
    <div id="selProd"></div>

    <input id="orderName" placeholder="Nama">
    <input id="orderDate" readonly>

    <button class="btn-primary" onclick="nextPay()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">

    <h3>PAYMENT QRIS</h3>

    <img id="qrisImg" class="qris-img" src="URL_QRIS_KAMU">

    <a id="downloadQris" class="btn-primary" download style="display:block;text-align:center">
      DOWNLOAD QRIS
    </a>

    <input type="file" id="proof">

    <button class="btn-primary" onclick="sendWA()">KIRIM ADMIN</button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedProduct = null;
let uploadedURL = "";

const waAdmin = "6285198959920";

function renderCat(){
  const cats=["Game","Voucher","Premium","Tools"];

  document.getElementById("catCards").innerHTML =
  cats.map(c=>`<div class="cat-card">${c}</div>`).join("");
}

function renderProd(){
  const p=[
    {name:"Produk A",price:10000},
    {name:"Produk B",price:20000}
  ];

  document.getElementById("productsGrid").innerHTML =
  p.map(x=>`
    <div class="product-card">
      <div class="prod-info">
        <div>${x.name}</div>
        <div>Rp ${x.price}</div>
        <button class="btn-order" onclick='openOrder(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>
  `).join("");
}

function openOrder(p){
  selectedProduct=p;
  document.getElementById("selProd").innerText=p.name;
  document.getElementById("orderDate").value=new Date().toLocaleDateString();
  document.getElementById("orderOverlay").classList.add("show");
}

function nextPay(){
  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");
}

async function sendWA(){

  const file=document.getElementById("proof").files[0];
  if(!file){return alert("Upload dulu");}

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=API_KEY_KAMU",{method:"POST",body:fd});
  const data=await res.json();

  uploadedURL=data.data.url;

  const msg=encodeURIComponent(
`🛒 ORDER BARU
📦 Produk: ${selectedProduct.name}
💰 Harga: Rp ${selectedProduct.price}
👤 Nama: ${document.getElementById("orderName").value}
📅 Tanggal: ${document.getElementById("orderDate").value}

💳 Payment: QRIS
📸 Bukti: ${uploadedURL}
🔗 URL Bukti: ${uploadedURL}
`
  );

  window.open(`https://wa.me/${waAdmin}?text=${msg}`,"_blank");

  show("Terkirim");
}

function show(t){
  const x=document.getElementById("toast");
  x.innerText=t;
  x.classList.add("show");
  setTimeout(()=>x.classList.remove("show"),2000);
}

renderCat();
renderProd();
</script>

</body>
</html>
