<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #05020f;
  --bg2: #0a0520;
  --purple: #9b30ff;
  --neon: #bf5fff;
  --neon2: #00f5ff;
  --pink: #ff2d78;
  --card: #0f0825;
  --border: rgba(155,48,255,0.3);
  --text: #f0e6ff;
  --sub: #8b7aaa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

.navbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:#070312;
}

.logo-name{
  font-family:'Orbitron',sans-serif;
  color:var(--neon);
  font-weight:700;
}

.banner-wrap img,
.banner-wrap video{
  width:100%;
  max-height:300px;
  object-fit:cover;
  display:block;
}

.section{
  padding:20px 16px;
}

.section-title{
  margin-bottom:14px;
  color:var(--neon2);
  font-size:12px;
  letter-spacing:2px;
}

.cat-scroll{
  display:flex;
  gap:10px;
  overflow:auto;
}

.cat-btn{
  padding:8px 18px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  cursor:pointer;
}

.cat-btn.active{
  background:var(--purple);
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:16px 16px 100px;
}

@media(min-width:700px){
  .products-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.product-card.pinned::after{
  content:'📌 PIN';
  position:absolute;
  top:8px;
  left:8px;
  background:var(--pink);
  color:white;
  font-size:10px;
  padding:4px 8px;
  border-radius:20px;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
}

.prod-thumb-placeholder{
  width:100%;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1a0533;
  font-size:42px;
}

.prod-info{
  padding:12px;
}

.prod-name{
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

.prod-price{
  color:var(--neon);
  margin-bottom:12px;
  font-weight:700;
}

.btn-order{
  width:100%;
  border:none;
  border-radius:10px;
  padding:10px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--purple),#6b00cc);
  color:white;
  font-weight:700;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--sub);
}

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.8);
  z-index:999;
}

.overlay.show{
  display:flex;
}

.overlay-box{
  width:100%;
  max-width:400px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

.form-input{
  width:100%;
  margin-top:6px;
  margin-bottom:14px;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0d0820;
  color:white;
}

.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
  cursor:pointer;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  padding:12px 24px;
  border-radius:30px;
  display:none;
}

.toast.show{
  display:block;
}

</style>
</head>
<body>

<nav class="navbar">
  <div class="logo-name" id="storeName">
    IPUNGG SHOP
  </div>
</nav>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="section">
  <div class="section-title">
    ✦ KATEGORI
  </div>

  <div class="cat-scroll" id="catFilter">
    <button class="cat-btn active" onclick="filterCat('all', this)">
      Semua
    </button>
  </div>
</div>

<div class="products-grid" id="productsGrid">
  <div class="empty">
    Loading produk...
  </div>
</div>

<div class="overlay" id="orderOverlay">
  <div class="overlay-box">

    <h2 style="margin-bottom:16px">
      🛒 ORDER
    </h2>

    <div id="selProdName" style="font-weight:700"></div>

    <div id="selProdPrice" style="margin-top:4px;color:var(--neon)">
    </div>

    <input class="form-input" id="orderName" placeholder="Nama kamu">

    <select class="form-input" id="orderPayment">
      <option value="">Pilih pembayaran</option>
      <option value="QRIS">QRIS</option>
      <option value="Dana">Dana</option>
      <option value="OVO">OVO</option>
      <option value="GoPay">GoPay</option>
    </select>

    <button class="btn-primary" onclick="submitOrder()">
      KIRIM ORDER
    </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",

  authDomain: "ipung-store-2b96d.firebaseapp.com",

  databaseURL: "https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "ipung-store-2b96d",

  storageBucket: "ipung-store-2b96d.firebasestorage.app",

  messagingSenderId: "906202337063",

  appId: "1:906202337063:web:1a39b7bad99a85b23c2302"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window._storeData = {};
window._activeCat = 'all';

onValue(ref(db, "store"), (snapshot) => {

  const data = snapshot.val() || {};

  console.log("STORE DATA:", data);

  window._storeData = data;

  applySettings(data.settings || {});
  renderBanner(data.settings || {});
  renderCategories(data.categories || {});

  renderProducts(
    data.products || {},
    window._activeCat || 'all'
  );

});

function applySettings(s){

  if(s.storeName){

    document.getElementById("storeName").textContent =
      s.storeName;

    document.title = s.storeName;

  }

}

function renderBanner(s){

  const wrap = document.getElementById("bannerWrap");

  const banner = s.banner || "";

  if(!banner){
    wrap.innerHTML = "";
    return;
  }

  if(banner.includes(".mp4")){

    wrap.innerHTML = `
      <video autoplay muted loop playsinline>
        <source src="${banner}" type="video/mp4">
      </video>
    `;

  } else {

    wrap.innerHTML = `
      <img src="${banner}">
    `;

  }

}

window.renderCategories = function(cats){

  const filter =
    document.getElementById("catFilter");

  const list = Object.values(cats || {});

  filter.innerHTML = `
    <button
      class="cat-btn active"
      onclick="filterCat('all', this)"
    >
      Semua
    </button>
  `;

  list.forEach(cat => {

    filter.innerHTML += `
      <button
        class="cat-btn"
        onclick="filterCat('${cat.name}', this)"
      >
        ${cat.name}
      </button>
    `;

  });

};

window.filterCat = function(cat, btn){

  window._activeCat = cat;

  document.querySelectorAll('.cat-btn')
    .forEach(x => x.classList.remove('active'));

  if(btn){
    btn.classList.add('active');
  }

  renderProducts(
    window._storeData.products || {},
    cat
  );

};

window.renderProducts = function(prods, activeCat){

  const grid =
    document.getElementById("productsGrid");

  let list =
    Object.values(prods || {});

  if(activeCat && activeCat !== 'all'){

    list = list.filter(
      p => p.category === activeCat
    );

  }

  list.sort(
    (a,b) =>
      (b.pinned === true) -
      (a.pinned === true)
  );

  if(list.length === 0){

    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:50px">📦</div>
        <div>Belum ada produk</div>
      </div>
    `;

    return;

  }

  grid.innerHTML = list.map((p,i)=>`

    <div
      class="product-card ${p.pinned ? 'pinned' : ''}"
    >

      ${
        p.thumbnail
        ? `
          <img
            class="prod-thumb"
            src="${p.thumbnail}"
            alt="${p.name}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          >
        `
        : ''
      }

      <div
        class="prod-thumb-placeholder"
        ${p.thumbnail ? 'style="display:none"' : ''}
      >
        📦
      </div>

      <div class="prod-info">

        <div class="prod-name">
          ${p.name || '-'}
        </div>

        <div class="prod-price">
          Rp ${Number(p.price || 0).toLocaleString('id-ID')}
        </div>

        <button
          class="btn-order"
          data-id="${p.id}"
        >
          🛒 ORDER
        </button>

      </div>

    </div>

  `).join('');

  document.querySelectorAll('.btn-order')
    .forEach(btn => {

      btn.onclick = () => {

        const id = btn.dataset.id;

        const prod = list.find(
          x => String(x.id) === String(id)
        );

        if(prod){
          openOrder(prod);
        }

      };

    });

};

window.openOrder = function(prod){

  window._selectedProduct = prod;

  document.getElementById("selProdName")
    .textContent = prod.name;

  document.getElementById("selProdPrice")
    .textContent =
      "Rp " +
      Number(prod.price)
      .toLocaleString('id-ID');

  document.getElementById("orderOverlay")
    .classList.add("show");

};

window.submitOrder = function(){

  const name =
    document.getElementById("orderName")
    .value.trim();

  const payment =
    document.getElementById("orderPayment")
    .value;

  if(!name){
    showToast("Isi nama dulu!");
    return;
  }

  if(!payment){
    showToast("Pilih pembayaran!");
    return;
  }

  const prod =
    window._selectedProduct;

  const wa = "6285198959920";

  const msg = encodeURIComponent(

`🛒 ORDER BARU

📦 Produk: ${prod.name}
💰 Harga: Rp ${Number(prod.price).toLocaleString('id-ID')}
👤 Nama: ${name}
💳 Pembayaran: ${payment}

Dikirim dari IPUNGG SHOP`

  );

  window.open(
    `https://wa.me/${wa}?text=${msg}`,
    '_blank'
  );

};

window.showToast = function(msg){

  const t =
    document.getElementById("toast");

  t.textContent = msg;

  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2500);

};

</script>

</body>
  </html>
