<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  position:sticky;
  top:0;
  background:#070312;
  border-bottom:1px solid var(--border);
  z-index:10;
}

.logo-name{color:var(--neon);font-family:'Orbitron';font-weight:800}

.hamburger{
  background:transparent;
  border:1px solid var(--border);
  color:white;
  padding:8px 12px;
  border-radius:10px;
}

/* MENU */
.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:260px;
  height:100%;
  background:#090312;
  transition:.3s;
  z-index:999;
  padding:20px;
}
.side-menu.open{right:0}

.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
}
.side-overlay.open{display:block}

.side-link{
  display:block;
  padding:12px;
  margin-top:10px;
  background:rgba(155,48,255,.1);
  border:1px solid var(--border);
  border-radius:10px;
  color:white;
}

/* BANNER */
.banner-wrap img{
  width:100%;
  max-height:260px;
  object-fit:cover;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:10px;
}

.cat-card{
  min-width:120px;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(155,48,255,.2),rgba(0,245,255,.08));
  border:1px solid var(--border);
  text-align:center;
  font-weight:700;
  transition:.25s;
}
.cat-card:hover{
  transform:scale(1.08);
  box-shadow:0 0 20px var(--purple);
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  animation:float 3s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.prod-thumb{width:100%;aspect-ratio:1;object-fit:cover}

.prod-info{padding:10px}

.btn{
  width:100%;
  padding:8px;
  border:none;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  border-radius:10px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:400px;
  background:#0a0520;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
}

.qris{
  width:200px;
  display:block;
  margin:10px auto;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu">
  <a class="side-link" id="wa">WA Admin</a>
  <a class="side-link" id="group">Grup</a>
  <a class="side-link" id="channel">Channel</a>
</div>

<div class="banner-wrap" id="banner"></div>

<div class="cat-cards" id="cats"></div>

<div class="products-grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <div id="pprice" style="color:var(--neon)"></div>

    <input id="name" placeholder="Nama">
    <input id="date" readonly>

    <button class="btn" onclick="nextPay()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">

    <h3>💳 QRIS PAYMENT</h3>

    <img class="qris" src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg">

    <a class="btn" style="display:block;text-align:center;margin-top:10px"
       href="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" download>
       📥 DOWNLOAD QRIS
    </a>

    <input type="file" id="proof">

    <button class="btn" onclick="send()">📩 KIRIM ADMIN</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

let dataStore = {};
let selected = {};

onValue(ref(db,"store"),(snap)=>{
  dataStore = snap.val() || {};

  document.getElementById("storeName").innerText =
    dataStore.settings?.storeName || "IPUNGG SHOP";

  document.getElementById("wa").href =
    "https://wa.me/"+(dataStore.settings?.urlAdmin||"").replace(/\D/g,'');

  renderCats();
  renderProducts();
});

function renderCats(){
  const wrap = document.getElementById("cats");
  const cats = Object.values(dataStore.categories||{});

  wrap.innerHTML = cats.map(c=>`
    <div class="cat-card" onclick="filterCat('${c.name}')">
      ${c.name}
    </div>
  `).join('');
}

window.filterCat = (cat)=>{
  renderProducts(cat);
}

function renderProducts(cat="all"){
  const wrap = document.getElementById("products");
  let p = Object.values(dataStore.products||{});

  if(cat!=="all") p = p.filter(x=>x.category===cat);

  wrap.innerHTML = p.map(x=>`
    <div class="product-card">
      <img class="prod-thumb" src="${x.thumbnail||''}">
      <div class="prod-info">
        <b>${x.name}</b><br>
        Rp ${x.price}
        <button class="btn" onclick='openOrder(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.openOrder = (p)=>{
  selected = p;
  document.getElementById("pname").innerText = p.name;
  document.getElementById("pprice").innerText = "Rp "+p.price;
  document.getElementById("date").value = new Date().toLocaleDateString();
  document.getElementById("orderBox").classList.add("show");
}

window.nextPay = ()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
}

window.send = async ()=>{
  const file = document.getElementById("proof").files[0];
  if(!file) return alert("upload dulu");

  const fd = new FormData();
  fd.append("image",file);

  const res = await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const json = await res.json();
  const img = json.data.url;

  const msg = encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

📦 ${selected.name}
💰 Rp ${selected.price}
👤 ${document.getElementById("name").value}

📸 Bukti: ${img}

⚡ QRIS PAYMENT`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}

window.toggleMenu = ()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}

/* FIX BACK BUTTON (NO EXIT WEB) */
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  document.querySelectorAll(".overlay").forEach(x=>x.classList.remove("show"));
  history.pushState(null,null,location.href);
});
</script>

</body>
</html>
