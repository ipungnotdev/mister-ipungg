<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>
body{
  margin:0;
  background:#05020f;
  color:white;
  font-family:sans-serif;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#0a0520;
  position:sticky;
  top:0;
  z-index:999;
}

.hamburger{
  font-size:22px;
  background:none;
  border:none;
  color:#00f5ff;
}

/* MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
}
.side-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:260px;
  height:100%;
  background:#120022;
  transition:.3s;
}
.side-menu.open{right:0}

.cat-cards{
  display:flex;
  gap:12px;
  overflow:auto;
  padding:10px;
}

.cat-card{
  min-width:160px;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(135deg,#2a0066,#120022);
  border:2px solid #9b30ff;
  font-weight:900;
  text-align:center;
  animation:float 2.5s infinite ease-in-out;
  cursor:pointer;
  transition:.2s;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.cat-card:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #9b30ff;
}

/* PRODUCT */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#0f0825;
  border:1px solid #9b30ff;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.btn{
  width:100%;
  padding:10px;
  background:#9b30ff;
  border:none;
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}
.overlay.show{display:flex}

.box{
  background:#120022;
  padding:20px;
  border-radius:12px;
  width:90%;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
}

/* QRIS */
.qris-img{
  width:200px;
  display:block;
  margin:auto;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#9b30ff;
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}

</style>
</head>

<body>

<div class="navbar">
  <div>IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="side-overlay" id="ov" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu"></div>

<div class="cat-cards" id="cats"></div>

<div class="products" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="order">
  <div class="box">
    <h3>ORDER</h3>
    <div id="pname"></div>
    <input id="nama" placeholder="Nama">
    <button class="btn" onclick="toPay()">LANJUT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="pay">
  <div class="box">
    <h3>QRIS</h3>
    <img id="qrisImg" class="qris-img">
    <a id="qrisDl" class="btn" download>DOWNLOAD QRIS</a>

    <input type="file" id="bukti">

    <button class="btn" onclick="send()">KIRIM</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"x",
  authDomain:"x",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

let store={}, selected={}, active="all";

onValue(ref(db,"store"),snap=>{
  store=snap.val()||{};
  render();
});

function render(){
  const s=store.settings||{};

  // QRIS FIX
  document.getElementById("qrisImg").src = s.qrisUrl || "";
  document.getElementById("qrisDl").href = s.qrisUrl || "";

  const cats=Object.values(store.categories||{});
  document.getElementById("cats").innerHTML=cats.map(c=>
    `<div class="cat-card" onclick="filter('${c.name}')">${c.name}</div>`
  ).join("");

  let p=Object.values(store.products||{});
  if(active!="all")p=p.filter(x=>x.category==active);

  document.getElementById("products").innerHTML=p.map(x=>
    `<div class="card">
      <img src="${x.thumbnail||''}">
      <div style="padding:10px">
        <div>${x.name}</div>
        <div>Rp ${x.price}</div>
        <button class="btn" onclick='order(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>`
  ).join("");
}

window.filter=(c)=>{active=c;render();};

window.order=(p)=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("order").classList.add("show");
};

window.toPay=()=>{
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.add("show");
};

window.send=async()=>{
  const file=document.getElementById("bukti").files[0];

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const j=await res.json();
  const img=j?.data?.url||"-";

  const msg=encodeURIComponent(
`🛒 ORDER

📦 ${selected.name}
💰 Rp ${selected.price}
📸 ${img}`
  );

  window.open("https://wa.me/"+store.settings.urlAdmin+"?text="+msg);
};

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("ov").classList.toggle("open");
};

// FIX BACK BUTTON NO EXIT
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  document.getElementById("menu").classList.remove("open");
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.remove("show");
  history.pushState(null,null,location.href);
});

</script>

</body>
</html>
