<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --border:rgba(155,48,255,0.3);
  --purple:#9b30ff;
  --neon:#00f5ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:white;
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  position:sticky;
  top:0;
  background:rgba(10,5,25,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Orbitron';
  color:var(--neon);
  display:flex;
  gap:6px;
  align-items:center;
}

/* HAMBURGER */
.hamburger{
  font-size:24px;
  background:none;
  border:none;
  color:var(--neon);
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:4000;
}

.overlay.show{display:flex}

.box{
  background:#0a0520;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  position:relative;
}

/* CLOSE BUTTON */
.close-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:red;
  border:none;
  color:white;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
}

/* INPUT */
.input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

/* BUTTON */
.btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon));
  color:white;
  cursor:pointer;
}

/* QRIS */
.qris{
  width:180px;
  margin:10px auto;
  display:block;
  border-radius:12px;
}

/* DOWNLOAD BTN */
.download{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  color:white;
  text-decoration:none;
  border:1px solid var(--border);
}

</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">🛒 IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <button class="close-btn" onclick="closeAll()">×</button>

    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <div id="pprice"></div>

    <input class="input" id="name" placeholder="Nama 💖">
    <button class="btn" onclick="nextPay()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <button class="close-btn" onclick="closeAll()">×</button>

    <h3>💳 QRIS PAYMENT</h3>

    <img id="qrisImg" class="qris">

    <!-- DOWNLOAD QRIS -->
    <a id="downloadQris" class="download" download>⬇ Download QRIS</a>

    <input type="file" id="proof" class="input">

    <button class="btn" onclick="send()">KIRIM ADMIN 💖</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9TSehgx",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

let store={}, selected={};

onValue(ref(db,"store"),snap=>{
  store=snap.val()||{};
  render();
});

function render(){
  const s=store.settings||{};

  const qris =
    s.qrisUrl ||
    "https://img2.pixhost.to/images/7838/725233706_elaina-1778564710301.jpg";

  document.getElementById("qrisImg").src = qris;

  /* DOWNLOAD QRIS */
  document.getElementById("downloadQris").href = qris;
}

/* ORDER */
window.order=(p)=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText="Rp "+p.price;
  document.getElementById("orderBox").classList.add("show");
};

window.nextPay=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
};

/* CLOSE ALL */
window.closeAll=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
};

window.send=async()=>{
  const file=document.getElementById("proof").files[0];

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const j=await res.json();
  const img=j?.data?.url||"";

  const msg=encodeURIComponent(
`💖 ORDER MASUK 💖

🛒 ${selected.name}
💰 Rp ${selected.price}

📸 ${img}

💌 Mohon diproses ya sayang 😘`
  );

  window.open("https://wa.me/"+store.settings.urlAdmin+"?text="+msg);

  closeAll();
};

</script>

</body>
</html>
