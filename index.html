<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05020f;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:900;
}

.hamburger{
  width:40px;height:40px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(155,48,255,0.1);
  color:white;
  font-size:22px;
}

/* MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
}
.side-overlay.open{opacity:1;pointer-events:auto}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:280px;
  height:100%;
  background:#0b0618;
  border-left:1px solid var(--border);
  transition:.3s;
}
.side-menu.open{right:0}

.side-link{
  display:block;
  padding:14px;
  margin:10px;
  border-radius:12px;
  background:rgba(155,48,255,0.1);
  border:1px solid var(--border);
  color:white;
  text-decoration:none;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:10px;
}

.cat-card{
  min-width:140px;
  padding:16px;
  border-radius:16px;
  background:#1a0a2a;
  border:1px solid var(--purple);
  text-align:center;
  font-weight:700;
}

/* PRODUCT */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{
  padding:10px;
}

.prod-price{
  color:var(--neon);
  font-weight:700;
}

.btn-order{
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  border:none;
  color:white;
  font-weight:800;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.7);
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:380px;
  background:#120822;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.qris-img{
  width:200px;
  margin:10px auto;
  display:block;
  border-radius:12px;
}

.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
}

</style>
</head>

<body>

<div class="navbar">
  <div class="logo-name">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu">
  <a class="side-link">WA Admin</a>
  <a class="side-link">Grup</a>
  <a class="side-link">Channel</a>
</div>

<div class="cat-cards" id="cat"></div>
<div class="products-grid" id="prod"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>ORDER</h3>
    <div id="pname"></div>
    <input id="nama" placeholder="Nama" class="btn" style="background:#1a0a2a">
    <button class="btn" onclick="next()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">

    <h3>PAYMENT QRIS</h3>

    <!-- QRIS FIX -->
    <img class="qris-img" src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg">

    <a class="btn"
       href="http://rahmad-elaina.my.id/file/0ff97318b1.jpg"
       download>
      DOWNLOAD QRIS
    </a>

    <input type="file" class="btn" id="bukti">

    <button class="btn" onclick="sendWA()">
      KIRIM BUKTI
    </button>

  </div>
</div>

<script>

let selected="";

/* MENU FIX */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}

/* BACK BUTTON FIX (NO EXIT WEB) */
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  if(document.getElementById("menu").classList.contains("open")){
    toggleMenu();
    history.pushState(null,null,location.href);
    return;
  }
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
  history.pushState(null,null,location.href);
});

/* DATA FIREBASE KAMU NANTI MASUK SINI */
let products = [];
let cats = [];

/* RENDER */
function render(){

  document.getElementById("cat").innerHTML =
  cats.length
  ? cats.map(c=>`<div class="cat-card">${c.name}</div>`).join("")
  : `<div class="cat-card">Semua</div>`;

  document.getElementById("prod").innerHTML =
  products.length
  ? products.map((p,i)=>`
    <div class="product-card">
      <img class="prod-thumb" src="${p.thumbnail||''}">
      <div class="prod-info">
        <b>${p.name}</b>
        <div class="prod-price">Rp ${p.price}</div>
        <button class="btn-order" onclick="order(${i})">ORDER</button>
      </div>
    </div>
  `).join("")
  : `<div style="padding:20px;color:#aaa">Belum ada produk</div>`;
}

render();

/* ORDER */
function order(i){
  selected=products[i];
  document.getElementById("pname").innerText=selected.name;
  document.getElementById("orderBox").classList.add("show");
}

function next(){
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
}

/* WA FIX FULL */
function sendWA(){

const img="UPLOAD_URL";

const msg=encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

📦 Produk : ${selected.name}
💰 Harga  : Rp ${selected.price}
👤 Nama   : ${document.getElementById("nama").value}

💳 QRIS ONLY
📸 Bukti  : ${img}

━━━━━━━━━━━━━━`
);

window.open("https://wa.me/6280000000000?text="+msg);
}

</script>

</body>
  </html>
