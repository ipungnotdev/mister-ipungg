<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --neon:#00f5ff;
  --text:#fff;
  --border:rgba(155,48,255,0.35);
}

/* BASE */
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-family:'Orbitron';
  color:var(--neon);
  text-shadow:0 0 10px var(--purple);
}

.hamburger{
  font-size:22px;
  background:none;
  border:none;
  color:var(--neon);
}

/* BANNER */
.banner-wrap img,
.banner-wrap video{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-bottom:2px solid var(--purple);
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:12px;
}

.cat-card{
  min-width:170px;
  padding:16px;
  border-radius:18px;

  background:linear-gradient(135deg,#2a0066,#120022);
  border:2px solid var(--purple);

  text-align:center;
  font-weight:900;
  letter-spacing:1px;

  color:white;

  transition:.25s;
  animation:float 2.8s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.cat-card:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px var(--purple),0 0 40px #6b00ff;
  border-color:var(--neon);
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 20px rgba(155,48,255,.5);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.btn{
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,var(--purple),#6b00cc);
  border:none;
  color:white;
  border-radius:10px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
  z-index:999;
}
.overlay.show{display:flex}

.box{
  background:#0a0520;
  border:1px solid var(--purple);
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:420px;
}

/* QRIS */
.qris-img{
  width:200px;
  display:block;
  margin:10px auto;
  border-radius:12px;
  border:1px solid var(--purple);
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon));
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}

</style>
</head>

<body>

<div class="navbar">
  <div class="logo" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="banner-wrap" id="banner"></div>

<div class="cat-cards" id="cats"></div>

<div class="products" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <input id="name" placeholder="Nama">
    <button class="btn" onclick="next()">LANJUT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <h3>💳 QRIS PAYMENT</h3>

    <img id="qrisImg" class="https://img2.pixhost.to/images/7838/725233706_elaina-1778564710301.jpg">
    <a id="qrisDl" class="btn" download>DOWNLOAD QRIS</a>

    <input type="file" id="proof">

    <button class="btn" onclick="send()">KIRIM ADMIN</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"x",
  authDomain:"x",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

let store={}, selected={}, active="all";

onValue(ref(db,"store"),snap=>{
  store=snap.val()||{};
  render();
});

function render(){
  const s=store.settings||{};

  // STORE NAME
  document.getElementById("storeName").innerText=s.storeName||"SHOP";

  // BANNER FIX
  document.getElementById("banner").innerHTML =
    s.banner?.includes(".mp4")
    ? `<video autoplay muted loop src="${s.banner}"></video>`
    : `<img src="${s.banner}">`;

  // QRIS FIX
  document.getElementById("qrisImg").src = s.qrisUrl || "";
  document.getElementById("qrisDl").href = s.qrisUrl || "";

  // CATEGORY
  const cats=Object.values(store.categories||{});
  document.getElementById("cats").innerHTML=cats.map(c=>
    `<div class="cat-card" onclick="filter('${c.name}')">${c.name}</div>`
  ).join("");

  // PRODUCTS
  let p=Object.values(store.products||{});
  if(active!="all")p=p.filter(x=>x.category==active);

  document.getElementById("products").innerHTML=p.map(x=>
    `<div class="card">
      <img src="${x.thumbnail||''}">
      <div class="card-body">
        <div>${x.name}</div>
        <div>Rp ${x.price}</div>
        <button class="btn" onclick='order(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>`
  ).join("");
}

window.filter=(c)=>{active=c;render();};

window.order=(p)=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("orderBox").classList.add("show");
};

window.next=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
};

window.send=async()=>{
  const file=document.getElementById("proof").files[0];
  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const j=await res.json();
  const img=j?.data?.url||"-";

  const msg=encodeURIComponent(
`🛒 ORDER BARU

📦 ${selected.name}
💰 Rp ${selected.price}
📸 ${img}

💳 QRIS: ${store.settings.qrisUrl}`
  );

  window.open("https://wa.me/"+store.settings.urlAdmin+"?text="+msg);
};

// BACK FIX NO EXIT
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
  history.pushState(null,null,location.href);
});

</script>

</body>
  </html>
