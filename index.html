<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05020f;
  --bg2:#0a0520;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-area{display:flex;gap:10px;align-items:center;}

.logo-icon{
  width:38px;height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  display:flex;align-items:center;justify-content:center;
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:700;
}

.hamburger{
  width:40px;height:40px;
  border:none;
  border-radius:12px;
  background:rgba(155,48,255,0.12);
  color:var(--neon);
  font-size:22px;
}

/* SIDE */
.side-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  opacity:0;pointer-events:none;
  transition:.3s;
}

.side-overlay.open{opacity:1;pointer-events:auto;}

.side-menu{
  position:fixed;
  right:-320px;
  top:0;
  width:280px;
  height:100vh;
  background:#090312;
  transition:.3s;
  border-left:1px solid var(--border);
}

.side-menu.open{right:0;}

.side-header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.side-title{color:var(--neon);font-family:'Orbitron';}

.side-links{padding:18px;display:flex;flex-direction:column;gap:12px;}

.side-link{
  padding:14px;
  border-radius:14px;
  background:rgba(155,48,255,.08);
  border:1px solid rgba(155,48,255,.15);
  text-decoration:none;
  color:white;
}

/* BANNER */
.banner-wrap img,.banner-wrap video{
  width:100%;
  max-height:300px;
  object-fit:cover;
}

/* SECTION */
.section{padding:20px 16px;}

.section-title{
  margin-bottom:14px;
  color:var(--neon2);
  font-size:12px;
  letter-spacing:2px;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:12px;
  overflow:auto;
}

.cat-card{
  min-width:120px;
  height:90px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(155,48,255,.12),rgba(0,245,255,.06));
  border:1px solid rgba(155,48,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  transition:.3s;
}

.cat-card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 25px rgba(155,48,255,.4);
}

/* FILTER */
.cat-scroll{display:flex;gap:10px;overflow:auto;}

.cat-btn{
  padding:8px 18px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
}

.cat-btn.active{background:var(--purple);}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:16px 16px 100px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.prod-info{padding:12px;}

.prod-name{font-weight:700;margin-bottom:6px;}

.prod-price{color:var(--neon);margin-bottom:10px;}

.btn-order{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),#6b00cc);
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}

.overlay.show{display:flex;}

.overlay-box{
  width:100%;
  max-width:400px;
  background:var(--bg2);
  border:1px solid var(--border);
  padding:20px;
  border-radius:20px;
}

.form-input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0d0820;
  color:white;
}

.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
}

/* QRIS */
.qris-img{
  width:220px;
  display:block;
  margin:15px auto;
}

</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-area">
    <div class="logo-icon">🤖</div>
    <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<div class="side-overlay" id="sideOverlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
  <div class="side-header">
    <div class="side-title">MENU</div>
    <button onclick="toggleMenu()">✕</button>
  </div>

  <div class="side-links">
    <a class="side-link" id="linkWa">WhatsApp</a>
    <a class="side-link" id="linkGroup">Grup</a>
    <a class="side-link" id="linkChannel">Channel</a>
  </div>
</div>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="section">
  <div class="section-title">KATEGORI</div>
  <div class="cat-cards" id="catCards"></div>
</div>

<div class="section">
  <div class="cat-scroll" id="catFilter"></div>
</div>

<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">

    <h3>🛒 ORDER</h3>

    <div id="selProdName"></div>
    <div id="selProdPrice"></div>

    <input class="form-input" id="orderName" placeholder="Nama">
    <input class="form-input" id="orderDate" readonly>
    <input class="form-input" value="QRIS ONLY" readonly>

    <button class="btn-primary" onclick="submitOrder()">LANJUT PAYMENT</button>

  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">

    <h3>💳 PAYMENT QRIS</h3>

    <img src="https://img2.pixhost.to/images/7838/725233706_elaina-1778564710301.jpg" class="qris-img">

    <input type="file" id="paymentProof" class="form-input">

    <button class="btn-primary" onclick="sendPaymentProof()">KIRIM ADMIN</button>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA",
  authDomain:"ipung-store.firebaseapp.com",
  databaseURL:"https://ipung-store.firebaseio.com",
  projectId:"ipung-store"
});

const db = getDatabase(app);

window._activeCat="all";

onValue(ref(db,"store"),(snap)=>{
  const d=snap.val()||{};
  renderCategories(d.categories||{});
  renderProducts(d.products||{});
});

window.renderCategories=(cats)=>{
  const list=Object.values(cats||{});
  document.getElementById("catCards").innerHTML=
    list.map(c=>`<div class="cat-card">${c.name}</div>`).join("");

  document.getElementById("catFilter").innerHTML=
    `<button class="cat-btn active">Semua</button>`+
    list.map(c=>`<button class="cat-btn">${c.name}</button>`).join("");
};

window.renderProducts=(prods)=>{
  const list=Object.values(prods||{});

  document.getElementById("productsGrid").innerHTML=
  list.map(p=>`
    <div class="product-card">
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">Rp ${p.price}</div>
        <button class="btn-order" onclick='openOrder(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join("");
};

window.openOrder=(p)=>{
  window._p=p;
  document.getElementById("selProdName").innerText=p.name;
  document.getElementById("selProdPrice").innerText="Rp "+p.price;
  document.getElementById("orderDate").value=new Date().toLocaleDateString();
  document.getElementById("orderOverlay").classList.add("show");
};

window.submitOrder=()=>{
  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");
};

window.sendPaymentProof=async()=>{
  const file=document.getElementById("paymentProof").files[0];
  if(!file) return alert("Upload dulu");

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=API_IMGBB_KAMU",{method:"POST",body:fd});
  const data=await res.json();

  const url=data.data.url;

  const msg=encodeURIComponent(
`🛒 *ORDER BARU*

📦 Produk : ${window._p.name}
💰 Harga  : Rp ${window._p.price}
👤 Nama   : ${document.getElementById("orderName").value}
📅 Tanggal: ${new Date().toLocaleDateString("id-ID")}

💳 Payment: QRIS
📸 Bukti :
${url}

━━━━━━━━━━
IPUNGG SHOP`
  );

  window.open("https://wa.me/6285xxxx?text="+msg,"_blank");
};

window.toggleMenu=()=>{
  document.getElementById("sideMenu").classList.toggle("open");
  document.getElementById("sideOverlay").classList.toggle("open");
};

</script>

</body>
      </html>
