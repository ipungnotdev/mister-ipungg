<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --bg2:#0a0520;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:#070312;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:700;
}

.hamburger{
  background:rgba(155,48,255,0.15);
  border:none;
  color:white;
  font-size:20px;
  padding:8px 12px;
  border-radius:10px;
}

/* CATEGORY */
.section{padding:15px;}

.section-title{
  color:var(--neon2);
  font-size:12px;
  margin-bottom:10px;
}

.cat-cards{
  display:flex;
  gap:10px;
  overflow:auto;
}

.cat-card{
  min-width:120px;
  padding:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

/* PRODUCT */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{
  padding:10px;
}

.prod-name{
  font-weight:700;
}

.prod-price{
  color:var(--neon);
  margin:5px 0;
}

.btn-order{
  width:100%;
  padding:8px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  border:none;
  color:white;
  font-weight:700;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.overlay.show{display:flex;}

.overlay-box{
  width:90%;
  max-width:400px;
  background:var(--bg2);
  padding:20px;
  border-radius:15px;
}

.form-input{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

.btn-primary{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
}

.qris-img{
  width:200px;
  display:block;
  margin:10px auto;
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<!-- CATEGORY -->
<div class="section">
  <div class="section-title">KATEGORI</div>
  <div class="cat-cards" id="catCards"></div>
</div>

<!-- PRODUCTS -->
<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">
    <h3>ORDER</h3>

    <div id="selProdName"></div>
    <div id="selProdPrice"></div>

    <input class="form-input" id="orderName" placeholder="Nama">
    <input class="form-input" id="orderDate" readonly>
    <input class="form-input" value="QRIS ONLY" readonly>

    <button class="btn-primary" onclick="submitOrder()">LANJUT BAYAR</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">

    <h3>QRIS PAYMENT</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qris-img">

    <input type="file" id="paymentProof" class="form-input">

    <button class="btn-primary" onclick="sendPaymentProof()">
      KIRIM KE ADMIN
    </button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

window._activeCat = "all";

onValue(ref(db,"store"), (snap)=>{

  const data = snap.val() || {};

  document.getElementById("storeName").innerText =
    data.settings?.storeName || "IPUNGG SHOP";

  renderCats(data.categories || {});
  renderProducts(data.products || {});
});

function renderCats(cats){
  const wrap = document.getElementById("catCards");
  wrap.innerHTML = "";

  Object.values(cats).forEach(c=>{
    wrap.innerHTML += `
      <div class="cat-card" onclick="filterCat('${c.name}')">
        ${c.name}
      </div>
    `;
  });
}

window.filterCat = function(cat){
  window._activeCat = cat;
};

function renderProducts(prods){
  const wrap = document.getElementById("productsGrid");

  let list = Object.values(prods);

  if(window._activeCat !== "all"){
    list = list.filter(p => p.category === window._activeCat);
  }

  wrap.innerHTML = list.map(p=>`
    <div class="product-card">
      <img class="prod-thumb" src="${p.thumbnail || ''}">
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
        <button class="btn-order" onclick='openOrder(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.openOrder = function(p){
  window._selectedProduct = p;

  document.getElementById("selProdName").innerText = p.name;
  document.getElementById("selProdPrice").innerText = "Rp "+p.price;
  document.getElementById("orderDate").value = new Date().toLocaleDateString();

  document.getElementById("orderOverlay").classList.add("show");
};

window.submitOrder = function(){
  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");
};

window.sendPaymentProof = async function(){

  const file = document.getElementById("paymentProof").files[0];
  if(!file) return alert("Upload bukti dulu!");

  const form = new FormData();
  form.append("image", file);

  const res = await fetch("https://api.imgbb.com/1/upload?key=API_IMGBB_KAMU",{
    method:"POST",
    body:form
  });

  const data = await res.json();
  const img = data?.data?.url || "-";

  const p = window._selectedProduct;

  const msg = encodeURIComponent(
`🛒 ORDER BARU

📦 Produk: ${p.name}
💰 Harga: Rp ${p.price}
👤 Nama: ${window._orderName || '-'}

📸 Bukti:
${img}

QRIS PAYMENT`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
};

</script>

</body>
</html>
