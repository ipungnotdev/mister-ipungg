<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;}

.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:700;
}

.hamburger{
  width:40px;height:40px;
  border:none;border-radius:10px;
  background:rgba(155,48,255,0.2);
  color:white;
}

/* banner */
.banner-wrap img,.banner-wrap video{
  width:100%;
  max-height:280px;
  object-fit:cover;
}

/* category */
.section{padding:14px}
.cat-scroll{display:flex;gap:10px;overflow:auto}
.cat-btn{
  padding:8px 14px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
}
.cat-btn.active{background:var(--purple)}

/* products */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:14px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
}

.prod-thumb{width:100%;aspect-ratio:1;object-fit:cover}
.prod-thumb-placeholder{height:130px;display:flex;align-items:center;justify-content:center}
.prod-info{padding:10px}
.prod-name{font-weight:700}
.prod-price{color:var(--neon);margin:5px 0}

.btn-order{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
}

/* overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}
.overlay.show{display:flex}
.overlay-box{
  background:#0a0520;
  padding:18px;
  border-radius:14px;
  width:90%;
  max-width:380px;
}

.form-input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#0d0820;
  color:white;
}

.btn-primary{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
}

.qris-img{
  width:200px;
  margin:10px auto;
  display:block;
  border-radius:12px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleOrder()">☰</button>
</div>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="section">
  <div class="cat-scroll" id="catFilter"></div>
</div>

<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">
    <h3>🛒 ORDER</h3>

    <div id="selProd"></div>

    <input class="form-input" id="orderName" placeholder="Nama">
    <input class="form-input" id="orderDate" readonly>

    <button class="btn-primary" onclick="goPay()">LANJUT PEMBAYARAN</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">
    <h3>💳 QRIS</h3>

    <img id="qrisImg" class="qris-img">
    <a id="qrisDownload" class="btn-primary" download style="display:block;text-align:center">DOWNLOAD QRIS</a>

    <input type="file" class="form-input" id="proof">

    <button class="btn-primary" onclick="sendWA()">KIRIM ADMIN</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
});

const db = getDatabase(app);

let store={}, active="all", selected=null, nama="";

const QRIS = "http://rahmad-elaina.my.id/file/0ff97318b1.jpg";
const IMGBB = "a8a4d55f889fcadd95552214d55c46b3";

onValue(ref(db,"store"),snap=>{
  store = snap.val()||{};
  render();
});

function render(){
  document.getElementById("storeName").innerText = store.settings?.storeName||"IPUNGG SHOP";

  document.getElementById("bannerWrap").innerHTML =
    store.settings?.banner?.includes(".mp4")
    ? `<video autoplay muted loop><source src="${store.settings.banner}"></video>`
    : `<img src="${store.settings?.banner}">`;

  const cats = Object.values(store.categories||{});
  document.getElementById("catFilter").innerHTML =
    `<button class="cat-btn active" onclick="setCat('all')">Semua</button>` +
    cats.map(c=>`<button class="cat-btn" onclick="setCat('${c.name}')">${c.name}</button>`).join("");

  let prods = Object.values(store.products||{});
  if(active!="all") prods = prods.filter(p=>(p.category||"").trim()==active.trim());

  document.getElementById("productsGrid").innerHTML =
    prods.map(p=>`
      <div class="product-card">
        ${p.thumbnail?`<img class="prod-thumb" src="${p.thumbnail}">`:`<div class="prod-thumb-placeholder">📦</div>`}
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">Rp ${Number(p.price).toLocaleString()}</div>
          <button class="btn-order" onclick='openOrder(${JSON.stringify(p)})'>ORDER</button>
        </div>
      </div>
    `).join("");
}

window.setCat=(c)=>{active=c;render();};

window.openOrder=(p)=>{
  selected=p;
  document.getElementById("selProd").innerText=p.name;
  document.getElementById("orderDate").value=new Date().toLocaleDateString("id-ID");
  document.getElementById("orderOverlay").classList.add("show");
};

window.goPay=()=>{
  nama=document.getElementById("orderName").value;

  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");

  document.getElementById("qrisImg").src = QRIS;
  document.getElementById("qrisDownload").href = QRIS;
};

window.sendWA=async()=>{
  const file=document.getElementById("proof").files[0];
  if(!file) return alert("upload bukti dulu");

  const fd=new FormData();
  fd.append("image",file);

  const r=await fetch("https://api.imgbb.com/1/upload?key="+IMGBB,{method:"POST",body:fd});
  const j=await r.json();

  const img=j.data.url;

  const msg = encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

📦 Produk : ${selected.name}
💰 Harga  : Rp ${selected.price}
👤 Nama   : ${nama}

💳 QRIS ONLY
📸 Bukti : ${img}
`
  );

  window.open("https://wa.me/628xxxxxxx?text="+msg,"_blank");
};
</script>

</body>
</html>
