<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --cyan:#00f5ff;
  --border:rgba(155,48,255,0.25);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani';
  overflow-x:hidden;
}

/* NAVBAR */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Orbitron';
  color:var(--cyan);
  font-weight:700;
}

.hamburger{
  font-size:22px;
  border:none;
  background:rgba(155,48,255,0.12);
  color:var(--cyan);
  width:42px;
  height:42px;
  border-radius:12px;
}

/* SIDE MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.side-overlay.open{opacity:1;pointer-events:auto}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:260px;
  height:100%;
  background:#0b0618;
  border-left:1px solid var(--border);
  transition:.3s;
  z-index:2000;
}
.side-menu.open{right:0}

.side-header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  color:var(--cyan);
}

.side-links a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  margin:10px;
  border-radius:12px;
  background:rgba(155,48,255,0.08);
  border:1px solid var(--border);
  text-decoration:none;
  color:white;
}

/* ICON */
.icon{
  font-size:16px;
}

/* BANNER (lebih kecil) */
.banner img, .banner video{
  width:100%;
  max-height:180px;
  object-fit:cover;
}

/* SECTION */
.section{padding:14px}

.title{
  font-size:12px;
  color:var(--cyan);
  letter-spacing:2px;
  margin-bottom:10px;
}

/* CATEGORY */
.cat-wrap{
  display:flex;
  gap:10px;
  overflow:auto;
}

.cat{
  min-width:120px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#1a0933,#0b0618);
  border:1px solid var(--border);
  text-align:center;
  transition:.25s;
  cursor:pointer;
  font-weight:600;
}

.cat:hover{
  transform:scale(1.08);
  box-shadow:0 0 15px var(--purple);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.price{
  color:var(--cyan);
  font-weight:700;
}

.btn{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),#5b00cc);
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
  z-index:3000;
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:380px;
  background:#0b0618;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
}

.input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#120a25;
  color:white;
}

.qr{
  width:180px;
  display:block;
  margin:10px auto;
  border-radius:12px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  padding:10px 18px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <div class="logo">⚡ IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<!-- MENU -->
<div class="side-overlay" id="ov" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu">
  <div class="side-header">
    MENU
    <button onclick="toggleMenu()">✕</button>
  </div>

  <div class="side-links">
    <a id="wa">💬 WhatsApp</a>
    <a id="group">👥 Grup</a>
    <a id="channel">📢 Channel</a>
  </div>
</div>

<!-- BANNER -->
<div class="banner" id="banner"></div>

<!-- CATEGORY -->
<div class="section">
  <div class="title">KATEGORI</div>
  <div class="cat-wrap">
    <div class="cat" onclick="filter('all')">🔥 Semua</div>
    <div id="cats"></div>
  </div>
</div>

<!-- PRODUCTS -->
<div class="grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="order">
  <div class="box">
    <h3>ORDER</h3>
    <div id="pname"></div>
    <div id="pprice" class="price"></div>

    <input class="input" id="name" placeholder="Nama">
    <input class="input" id="date" readonly>

    <button class="btn" onclick="next()">Lanjut</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="pay">
  <div class="box">
    <h3>PAYMENT</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qr">

    <input type="file" class="input" id="proof">

    <button class="btn" onclick="send()">Kirim</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9...",
  authDomain:"ipung-store",
  databaseURL:"https://ipung-store-default.firebaseio.com"
});

const db = getDatabase(app);

let data={}, selected={}, list=[];

onValue(ref(db,"store"),snap=>{
  data=snap.val()||{};
  render();
});

function render(){

  // banner kecil
  const b=document.getElementById("banner");
  const bn=data.settings?.banner;
  b.innerHTML = bn?.includes(".mp4")
  ? `<video autoplay muted loop src="${bn}"></video>`
  : `<img src="${bn||''}">`;

  // cat
  const c=document.getElementById("cats");
  c.innerHTML="";
  Object.values(data.categories||{}).forEach(cat=>{
    c.innerHTML+=`<div class="cat" onclick="filter('${cat.name}')">${cat.name}</div>`;
  });

  list=Object.values(data.products||{});
  show(list);
}

window.filter=(c)=>{
  if(c==='all') return show(list);
  show(list.filter(p=>p.category===c));
}

function show(arr){
  const g=document.getElementById("products");
  g.innerHTML=arr.map(p=>`
    <div class="card">
      <img src="${p.thumbnail||''}">
      <div class="card-body">
        <b>${p.name}</b>
        <div class="price">Rp ${Number(p.price).toLocaleString()}</div>
        <button class="btn" onclick='order(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.order=(p)=>{
  selected=p;
  document.getElementById("order").classList.add("show");
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=p.price;
  document.getElementById("date").value=new Date().toLocaleDateString();
  history.pushState({},'');
}

window.next=()=>{
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.add("show");
  history.pushState({},'');
}

window.send=()=>{
  const msg=encodeURIComponent(
`ORDER BARU

Nama: ${document.getElementById("name").value}
Tanggal: ${new Date().toLocaleDateString()}
Produk: ${selected.name}
Harga: ${selected.price}`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("ov").classList.toggle("open");
}

// FIX BACK HP (NO EXIT WEB)
window.addEventListener("popstate",()=>{
  document.getElementById("menu").classList.remove("open");
  document.getElementById("ov").classList.remove("open");
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.remove("show");
  history.pushState({},'');
});

history.pushState({},'');
</script>

</body>
  </html>
