<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --border:rgba(155,48,255,.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:800;
}

.hamburger{
  padding:8px 12px;
  border:1px solid var(--border);
  background:transparent;
  color:white;
  border-radius:10px;
}

/* PRODUCT */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{
  padding:10px;
}

.btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:99;
}

.overlay.show{display:flex}

.box{
  width:92%;
  max-width:380px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* ===== PAYMENT UI CLEAN ===== */
.qris{
  width:170px;
  margin:10px auto;
  display:block;
  border-radius:12px;
  border:1px solid var(--border);
}

.pay-title{
  font-size:16px;
  font-weight:800;
  text-align:center;
  margin-bottom:6px;
}

.pay-sub{
  font-size:12px;
  color:#aaa;
  text-align:center;
  margin-bottom:10px;
}

.pay-btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.btn-download{
  background:#1b0b33;
  border:1px solid var(--border);
  color:var(--neon2);
}

.btn-send{
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
  font-size:13px;
}

.file{
  margin-top:10px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo-name">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggle()">☰</button>
</div>

<div class="products-grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="order">
  <div class="box">
    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <div id="pprice" style="color:var(--neon)"></div>

    <input id="name" placeholder="Nama">
    <input id="date" readonly>

    <button class="btn" onclick="next()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT CLEAN UI -->
<div class="overlay" id="pay">

  <div class="box">

    <div class="pay-title">💳 QRIS PAYMENT</div>
    <div class="pay-sub">Scan atau download QRIS untuk pembayaran</div>

    <img class="qris"
      src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg">

    <a class="pay-btn btn-download"
       href="http://rahmad-elaina.my.id/file/0ff97318b1.jpg"
       download>
       📥 Download QRIS
    </a>

    <input type="file" id="proof">

    <div class="file">📸 Upload bukti pembayaran (jpg/png)</div>

    <button class="pay-btn btn-send" onclick="send()">
      📩 Kirim ke Admin
    </button>

  </div>

</div>

<script>
let selected={};

function toggle(){
  alert("menu placeholder");
}

function openOrder(p){
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText="Rp "+p.price;
  document.getElementById("date").value=new Date().toLocaleDateString();
  document.getElementById("order").classList.add("show");
}

function next(){
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.add("show");
}

async function send(){

  const file=document.getElementById("proof").files[0];
  if(!file)return alert("Upload bukti dulu");

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch(
    "https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",
    {method:"POST",body:fd}
  );

  const json=await res.json();
  const img=json.data.url;

  const msg=encodeURIComponent(
`🛒 ORDER BARU

📦 ${selected.name}
💰 Rp ${selected.price}
👤 ${document.getElementById("name").value}

💳 QRIS PAYMENT
📸 Bukti: ${img}

⚡ IPUNGG SHOP`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}

/* dummy product biar keliatan */
document.getElementById("products").innerHTML=`
  <div class="product-card">
    <img class="prod-thumb" src="https://via.placeholder.com/300">
    <div class="prod-info">
      Item Demo
      <button class="btn" onclick="openOrder({name:'Demo',price:10000})">ORDER</button>
    </div>
  </div>
`;
</script>

</body>
</html>
