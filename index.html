<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05020f;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani';
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:900;
}

.hamburger{
  width:40px;height:40px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(155,48,255,0.1);
  color:white;
  font-size:22px;
}

/* SIDE MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.side-overlay.open{opacity:1;pointer-events:auto}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:280px;
  height:100%;
  background:#0b0618;
  transition:.3s;
  border-left:1px solid var(--border);
}
.side-menu.open{right:0}

.side-link{
  display:block;
  padding:14px;
  margin:10px;
  border-radius:12px;
  background:rgba(155,48,255,0.1);
  border:1px solid var(--border);
  color:white;
  text-decoration:none;
}

/* CATEGORY FIX */
.cat-cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:10px 12px;
}

.cat-card{
  min-width:140px;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(135deg,#2a0a4a,#0b0618);
  border:2px solid var(--purple);
  box-shadow:0 0 20px rgba(155,48,255,.4);
  transition:.3s;
  text-align:center;
  font-weight:800;
}

.cat-card:hover{
  transform:scale(1.08);
  box-shadow:0 0 30px var(--neon);
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  animation:float 3s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{
  padding:10px;
}

.btn-order{
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,var(--purple),#5a00ff);
  border:none;
  color:white;
  font-weight:800;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.7);
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:380px;
  background:#120822;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

/* QRIS */
.qris{
  width:200px;
  display:block;
  margin:10px auto;
  border-radius:12px;
  border:2px solid var(--purple);
}

.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
}

</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <div class="logo-name">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<!-- SIDE -->
<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="menu">
  <a class="side-link">💬 WA Admin</a>
  <a class="side-link">👥 Grup</a>
  <a class="side-link">📢 Channel</a>
</div>

<!-- CATEGORY -->
<div class="cat-cards" id="cat"></div>

<!-- PRODUCTS -->
<div class="products-grid" id="prod"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>🛒 ORDER</h3>

    <div id="pname"></div>

    <input id="nama" placeholder="Nama" class="btn" style="background:#1a0a2a;margin-top:10px">

    <button class="btn" onclick="next()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">

    <h3>💳 PAYMENT QRIS</h3>

    <!-- QRIS FIX -->
    <img class="qris" src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg">

    <a class="btn" href="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" download>
      📥 DOWNLOAD QRIS
    </a>

    <input type="file" class="btn" id="bukti">

    <button class="btn" onclick="sendWA()">
      📤 KIRIM BUKTI
    </button>

  </div>
</div>

<script>

let selected="";

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}

/* BACK BUTTON FIX */
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>{
  if(document.getElementById("menu").classList.contains("open")){
    toggleMenu();
    history.pushState(null,null,location.href);
    return;
  }
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
  history.pushState(null,null,location.href);
});

/* DEMO DATA (biar produk muncul) */
let products=[
 {name:"Diamond 100",price:5000},
 {name:"Voucher VIP",price:10000}
];

let cats=["🔥 HOT","💎 DIAMOND","⚡ VIP"];

function render(){
  document.getElementById("cat").innerHTML =
  cats.map(c=>`<div class="cat-card">${c}</div>`).join("");

  document.getElementById("prod").innerHTML =
  products.map((p,i)=>`
    <div class="product-card">
      <div class="prod-info">
        <b>${p.name}</b><br>
        Rp ${p.price}
        <button class="btn-order" onclick="order(${i})">ORDER</button>
      </div>
    </div>
  `).join("");
}

render();

function order(i){
  selected=products[i];
  document.getElementById("pname").innerText=selected.name;
  document.getElementById("orderBox").classList.add("show");
}

function next(){
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
}

function sendWA(){

const img="UPLOAD_URL";

const msg=encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

📦 Produk : ${selected.name}
💰 Harga  : Rp ${selected.price}
👤 Nama   : ${document.getElementById("nama").value}

💳 QRIS PAYMENT
📸 Bukti: ${img}
━━━━━━━━━━━━`
);

window.open("https://wa.me/6280000000000?text="+msg);
}

</script>

</body>
      </html>
