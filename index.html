<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --border:rgba(155,48,255,0.3);
  --purple:#9b30ff;
  --neon:#00f5ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:white;
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  position:sticky;
  top:0;
  background:rgba(10,5,25,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Orbitron';
  color:var(--neon);
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px;
}

.cat-card{
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  white-space:nowrap;
  cursor:pointer;
}

/* GRID */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

/* CARD */
.product-card{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{padding:10px}

/* PIN */
.pin-badge{
  position:absolute;
  top:8px;
  left:8px;
  background:linear-gradient(135deg,#ffd700,#ffb300);
  color:black;
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
}

/* BUTTON */
.btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon));
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.overlay.show{display:flex}

.box{
  background:#0a0520;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:400px;
}

.input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

.qris{
  width:180px;
  margin:10px auto;
  border-radius:12px;
}

</style>
</head>

<body>

<nav class="navbar">
  <div class="logo" id="storeName">IPUNGG SHOP</div>
</nav>

<div class="cat-cards" id="cats"></div>

<div class="products-grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <div id="pprice"></div>

    <input class="input" id="name" placeholder="Nama kamu 💖">
    <button class="btn" onclick="nextPay()">LANJUT PAYMENT 💳</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <h3>💳 QRIS PAYMENT</h3>

    <img id="qrisImg" class="qris">

    <input type="file" id="proof" class="input">

    <button class="btn" onclick="send()">KIRIM KE ADMIN 💖</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9TSehgx",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

let store={}, active="all", selected={};

onValue(ref(db,"store"),snap=>{
  store=snap.val()||{};
  render();
});

function render(){

  const s=store.settings||{};
  document.getElementById("storeName").innerText=s.storeName||"SHOP";

  document.getElementById("qrisImg").src=s.qrisUrl||"";

  /* CATEGORY */
  const cats=Object.values(store.categories||{});
  document.getElementById("cats").innerHTML=
    `<div class="cat-card" onclick="filter('all')">ALL</div>`+
    cats.map(c=>`<div class="cat-card" onclick="filter('${c.name}')">${c.name}</div>`).join("");

  /* PRODUCTS */
  let all = Object.values(store.products||{});

  let p = active!="all"
    ? all.filter(x=>x.category==active)
    : all;

  const pinned = p.filter(x=>x.pinned);
  const normal = p.filter(x=>!x.pinned);

  p = [...pinned, ...normal];

  document.getElementById("products").innerHTML =
  p.map(x=>
    `<div class="product-card">
      ${x.pinned ? `<div class="pin-badge">PINNED</div>` : ""}
      <img class="prod-thumb" src="${x.thumbnail}">
      <div class="prod-info">
        <div>${x.name}</div>
        <div>Rp ${x.price}</div>
        <button class="btn" onclick='order(${JSON.stringify(x)})'>ORDER 💖</button>
      </div>
    </div>`
  ).join("");
}

window.filter=(c)=>{active=c;render();};

window.order=(p)=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=p.price;
  document.getElementById("orderBox").classList.add("show");
};

window.nextPay=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
};

window.send=async()=>{
  const file=document.getElementById("proof").files[0];

  if(!file){
    alert("Upload bukti dulu ya sayang 💖");
    return;
  }

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch(
    "https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",
    {method:"POST",body:fd}
  );

  const j=await res.json();
  const img=j?.data?.url || "-";

  const msg=encodeURIComponent(
`💖 ORDER MASUK SAYANG 💖

🛒 Produk : ${selected.name}
💰 Harga : Rp ${selected.price}
👤 Nama : ${document.getElementById("name").value || "-"}

📸 Bukti:
${img}

💌 Tolong diproses ya sayang 😘🙏`
  );

  window.open("https://wa.me/"+store.settings.urlAdmin+"?text="+msg);

  document.getElementById("payBox").classList.remove("show");
  document.getElementById("orderBox").classList.remove("show");
};

</script>

</body>
</html>
