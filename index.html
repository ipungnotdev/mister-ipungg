<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --card:#0f0825;
  --purple:#9b30ff;
  --cyan:#00f5ff;
  --border:rgba(155,48,255,.25);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani';
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  background:#070312;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
}

.logo{
  font-family:'Orbitron';
  font-size:18px;
  background:linear-gradient(90deg,#9b30ff,#00f5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hamburger{
  width:42px;height:42px;
  border:none;
  border-radius:10px;
  background:rgba(155,48,255,.2);
  color:var(--cyan);
  font-size:20px;
}

/* MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  z-index:998;
}
.side-overlay.open{opacity:1;pointer-events:auto}

.side-menu{
  position:fixed;
  right:-280px;
  top:0;
  width:260px;
  height:100%;
  background:#0b0618;
  border-left:1px solid var(--border);
  transition:.3s;
  z-index:999;
}
.side-menu.open{right:0}

/* BANNER */
.banner img,.banner video{
  width:100%;
  max-height:180px;
  object-fit:cover;
}

/* CATEGORY */
.section{padding:14px}

.cat-wrap{
  display:flex;
  gap:10px;
  overflow:auto;
}

.cat{
  min-width:130px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#1a0933,#0b0618);
  border:1px solid rgba(155,48,255,.3);
  text-align:center;
  cursor:pointer;
  transition:.25s;
  font-weight:600;
}
.cat:hover{
  transform:scale(1.08);
  box-shadow:0 0 18px rgba(155,48,255,.25);
}

/* PRODUCTS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:14px;
}

.card{
  background:linear-gradient(145deg,#120822,#0b0618);
  border:1px solid rgba(155,48,255,.25);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 18px rgba(155,48,255,.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 0 25px rgba(0,245,255,.15);
}

.card img{
  width:100%;
  height:130px;
  object-fit:cover;
  transition:.3s;
}

.card:hover img{
  transform:scale(1.05);
}

/* ORDER */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.7);
}
.overlay.show{display:flex}

.box{
  width:90%;
  max-width:380px;
  background:#0b0618;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#120a25;
  color:white;
}

.qr{
  width:180px;
  display:block;
  margin:12px auto;
  border-radius:14px;
  border:1px solid rgba(155,48,255,.3);
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  padding:10px 18px;
  border-radius:20px;
  display:none;
}
.toast.show{display:block}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</div>

<div class="side-overlay" id="ov" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu"></div>

<div class="banner" id="banner"></div>

<div class="section">
  <div class="cat-wrap">
    <div class="cat" onclick="filter('all')">🔥 Semua</div>
    <div id="cats"></div>
  </div>
</div>

<div class="grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="order">
  <div class="box">
    <h3>ORDER</h3>

    <input class="input" id="name" placeholder="Nama">
    <input class="input" id="date" readonly>

    <button class="input" onclick="next()">LANJUT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="pay">
  <div class="box">
    <h3>PAYMENT</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qr">

    <input type="file" class="input" id="proof">

    <button class="input" onclick="send()">KIRIM WA</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"xxx",
  authDomain:"xxx",
  databaseURL:"xxx"
});

const db = getDatabase(app);

let data={}, selected={}, list=[];

/* 🔥 TIDAK UBAH STRUKTUR (AMAN) */
onValue(ref(db,"/"),snap=>{
  const raw = snap.val() || {};

  data = {
    settings: raw.settings || raw.store?.settings || {},
    categories: raw.categories || raw.store?.categories || {},
    products: raw.products || raw.store?.products || {}
  };

  render();
});

function render(){

  const b=document.getElementById("banner");
  const bn=data.settings.banner;

  if(bn){
    b.innerHTML = bn.includes(".mp4")
      ? `<video autoplay muted loop src="${bn}"></video>`
      : `<img src="${bn}">`;
  }

  const c=document.getElementById("cats");
  c.innerHTML="";
  Object.values(data.categories).forEach(x=>{
    c.innerHTML += `<div class="cat" onclick="filter('${x.name}')">${x.name}</div>`;
  });

  list = Object.values(data.products);
  show(list);
}

window.filter=(cat)=>{
  if(cat==='all') return show(list);
  show(list.filter(p=>p.category===cat));
}

function show(arr){
  const g=document.getElementById("products");

  g.innerHTML = arr.map(p=>`
    <div class="card">
      <img src="${p.thumbnail||''}">
      <div style="padding:10px">
        <b>${p.name}</b>
        <div style="color:#00f5ff">Rp ${Number(p.price).toLocaleString()}</div>
        <button class="input" onclick='order(${JSON.stringify(p)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.order=(p)=>{
  selected=p;
  document.getElementById("order").classList.add("show");
  document.getElementById("date").value=new Date().toLocaleDateString();
}

window.next=()=>{
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.add("show");
}

window.send=()=>{
  const msg=encodeURIComponent(
`🛒 ORDER BARU IPUNGG SHOP

Nama : ${document.getElementById("name").value}
Tanggal : ${new Date().toLocaleDateString()}
Payment : QRIS ONLY

Produk : ${selected.name}
Harga : ${selected.price}`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("ov").classList.toggle("open");
}
</script>

</body>
  </html>
