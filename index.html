<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --border:rgba(155,48,255,0.3);
  --purple:#9b30ff;
  --neon:#00f5ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:white;
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  position:sticky;
  top:0;
  background:rgba(10,5,25,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Orbitron';
  color:var(--neon);
  display:flex;
  gap:6px;
}

/* HAMBURGER */
.hamburger{
  font-size:24px;
  background:none;
  border:none;
  color:var(--neon);
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{padding:10px}

.btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon));
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
}

.overlay.show{display:flex}

.box{
  background:#0a0520;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  position:relative;
}

.close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:red;
  color:white;
}

/* INPUT */
.input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

/* QRIS */
.qris{
  width:180px;
  display:block;
  margin:10px auto;
  border-radius:12px;
}

/* DOWNLOAD */
.download{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  color:white;
  text-decoration:none;
}

</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">🛒 IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggle()">☰</button>
</nav>

<!-- PRODUCTS -->
<div class="products-grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="orderBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>

    <h3>🛒 ORDER</h3>

    <div id="pname"></div>
    <div id="pprice"></div>

    <input class="input" id="name" placeholder="Nama 💖">

    <button class="btn" onclick="next()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="payBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>

    <h3>💳 QRIS</h3>

    <img id="qris" class="qris">

    <a id="dl" class="download" download>⬇ Download QRIS</a>

    <input type="file" id="proof" class="input">

    <button class="btn" onclick="send()">KIRIM WA 💖</button>
  </div>
</div>

<script>
let selected={};

const qrisURL="https://img2.pixhost.to/images/7862/725686808_elaina-1778651660610.jpg";

/* demo product */
const products=[
  {name:"Produk A",price:10000}
];

document.getElementById("products").innerHTML =
products.map(p=>`
<div class="product-card">
  <img class="prod-thumb" src="${qrisURL}">
  <div class="prod-info">
    <div>${p.name}</div>
    <div>Rp ${p.price}</div>
    <button class="btn" onclick='order(${JSON.stringify(p)})'>ORDER</button>
  </div>
</div>
`).join("");

function order(p){
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=p.price;
  document.getElementById("orderBox").classList.add("show");
}

function next(){
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");

  document.getElementById("qris").src=qrisURL;
  document.getElementById("dl").href=qrisURL;
}

function closeAll(){
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
}

/* WA FORMAT FOTO + TEKS */
function send(){

  const name=document.getElementById("name").value||"-";

  const msg=encodeURIComponent(
`${qrisURL}

🧾 ORDER IPUNGG SHOP

👤 Nama : ${name}
🛒 ${selected.name}
💰 Rp ${selected.price}

📸 Bukti Pembayaran:
${qrisURL}

💌 Mohon dicek & diproses ya admin 💖`
  );

  window.open("https://wa.me/628XXXXXXXXXX?text="+msg);
}
</script>

</body>
  </html>
