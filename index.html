<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --border:rgba(155,48,255,0.3);
  --purple:#9b30ff;
  --neon:#00f5ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:white;
  font-family:'Rajdhani',sans-serif;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  position:sticky;
  top:0;
  background:rgba(10,5,25,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Orbitron';
  color:var(--neon);
  display:flex;
  gap:6px;
  align-items:center;
}

.hamburger{
  font-size:24px;
  background:none;
  border:none;
  color:var(--neon);
}

/* MENU */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:2000;
}

.side-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.side-menu{
  position:fixed;
  right:-300px;
  top:0;
  width:260px;
  height:100vh;
  background:#0a0520;
  padding:20px;
  transition:.3s;
  z-index:3000;
}

.side-menu.open{right:0}

.side-head{
  display:flex;
  gap:6px;
  font-family:'Orbitron';
  color:var(--neon);
  margin-bottom:10px;
}

.side-link{
  display:block;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  color:white;
  text-decoration:none;
}

/* BANNER */
.banner-wrap img{
  width:95%;
  margin:10px auto;
  display:block;
  border-radius:16px;
  max-height:160px;
  object-fit:cover;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:10px;
}

.cat-card{
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  white-space:nowrap;
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.product-card{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  background:#0a0520;
  padding:8px;
}

.prod-info{padding:10px}

/* PIN */
.pin{
  position:absolute;
  top:8px;
  left:8px;
  background:gold;
  color:black;
  font-size:11px;
  padding:3px 7px;
  border-radius:999px;
}

/* BTN */
.btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon));
  color:white;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
}

.overlay.show{display:flex}

.box{
  background:#0a0520;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  position:relative;
}

/* CLOSE */
.close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:red;
  color:white;
}

/* INPUT */
.input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

/* QRIS */
.qris{
  width:180px;
  display:block;
  margin:10px auto;
  border-radius:12px;
}

/* DOWNLOAD */
.download{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  color:white;
  text-decoration:none;
}

/* COPYRIGHT */
.copyright{
  text-align:center;
  padding:30px 10px;
  margin-top:80px;

  font-family:'Orbitron', sans-serif;
  font-size:14px;
  color:#b07cff;

  position:relative;

  text-shadow:
    0 0 6px rgba(155,48,255,0.6),
    0 0 12px rgba(155,48,255,0.4);

  animation:floatSoft 4s ease-in-out infinite;
}

.copyright::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:170px;
  height:170px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(70,0,110,0.4), transparent 70%);
  filter:blur(18px);
  z-index:-1;
}

@keyframes floatSoft{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-6px);}
  100%{transform:translateY(0px);}
}

/* =========================
   UPLOAD BUTTON FIX
========================= */
.upload-btn{
  display:block;
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  text-align:center;

  background:linear-gradient(135deg,#9b30ff,#00f5ff);
  color:white;

  font-family:'Orbitron', sans-serif;
  font-size:13px;

  cursor:pointer;
  border:1px solid rgba(155,48,255,0.4);

  box-shadow:0 0 12px rgba(155,48,255,0.5);
  transition:0.2s;
}

.upload-btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px rgba(155,48,255,0.8);
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">🛒 IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="menu">
  <div class="side-head">🛍️ IPUNGG SHOP</div>
  <a class="side-link" id="wa">💬 WhatsApp Admin</a>
  <a class="side-link" id="group">👥 Group Bot Comunity</a>
  <a class="side-link" id="channel">📢 Channel Official Ipungg</a>
</div>

<div class="banner-wrap" id="banner"></div>
<div class="cat-cards" id="cats"></div>
<div class="products-grid" id="products"></div>

<div class="copyright">
  © IPUNGG X MEZUKI
</div>

<div class="overlay" id="orderBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>

    <h3>🛒 ORDER</h3>
    <div id="pname"></div>
    <div id="pprice"></div>

    <input class="input" id="name" placeholder="Nama 💖">
    <button class="btn" onclick="nextPay()">LANJUT PAYMENT</button>
  </div>
</div>

<div class="overlay" id="payBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>

    <h3>💳 QRIS</h3>
    <img id="qrisImg" class="qris">

    <a id="downloadQris" class="download" download>⬇ Download QRIS</a>

    <!-- 🔥 FIX UPLOAD BUTTON -->
    <label class="upload-btn">
      📤 Upload Bukti Pembayaran
      <input type="file" id="proof" hidden>
    </label>

    <button class="btn" onclick="send()">KIRIM ADMIN 💖</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9TSehgx",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ipung-store-2b96d"
});

const db = getDatabase(app);

let store={}, selected={}, active="all";

const rupiah = (num)=>
  new Intl.NumberFormat('id-ID',{
    style:'currency',
    currency:'IDR',
    minimumFractionDigits:0
  }).format(num);

onValue(ref(db,"store"),snap=>{
  store = snap.val() || {settings:{},products:{},categories:{}};
  render();
});

function render(){

  const s = store.settings || {};

  document.getElementById("wa").href="https://wa.me/"+(s.urlAdmin||"");
  document.getElementById("group").href=s.urlGroup||"#";
  document.getElementById("channel").href=s.urlChannel||"#";

  document.getElementById("banner").innerHTML =
    s.banner?.includes(".mp4")
    ? `<video autoplay muted loop src="${s.banner}"></video>`
    : `<img src="${s.banner}">`;

  const qris =
    s.qrisUrl ||
    "https://img2.pixhost.to/images/7838/725233706_elaina-1778564710301.jpg";

  document.getElementById("qrisImg").src = qris;
  document.getElementById("downloadQris").href = qris;

  const cats = Object.values(store.categories || {});
  document.getElementById("cats").innerHTML =
    `<div class="cat-card" onclick="filter('all')">ALL</div>`+
    cats.map(c=>`<div class="cat-card" onclick="filter('${c.name}')">${c.name}</div>`).join("");

  let all = Object.values(store.products || {});

  let p;
  if(active === "all"){
    p = all.filter(x => x.pinned);
  } else {
    p = all.filter(x => x.category == active);
  }

  document.getElementById("products").innerHTML =
  p.map(x=>
    `<div class="product-card">
      ${x.pinned ? `<div class="pin">PIN</div>` : ""}
      <img class="prod-thumb" src="${x.thumbnail}">
      <div class="prod-info">
        <div>${x.name}</div>
        <div>${rupiah(x.price)}</div>
        <button class="btn" onclick='order(${JSON.stringify(x)})'>ORDER 💖</button>
      </div>
    </div>`
  ).join("");
}

window.send = async () => {
  const file = document.getElementById("proof").files[0];

  const fd = new FormData();
  fd.append("image", file);

  const res = await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const j = await res.json();
  const img = j?.data?.url || "-";

  const name = document.getElementById("name").value || "-";

  const msg = encodeURIComponent(
`*📝 FORMAT ORDER PRODUK IPUNGG*

👤 Nama : ${name}
🛒 ${selected.name}
💰 ${rupiah(selected.price)}
📸 ${img}

💌 Mohon diproses ya admin 😘`
  );

  window.open("https://wa.me/"+store.settings.urlAdmin+"?text="+msg);

  closeAll();
};

window.filter=c=>{active=c;render();};

window.toggleMenu=()=>{
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
};

window.order=p=>{
  selected=p;
  document.getElementById("pname").innerText=p.name;
  document.getElementById("pprice").innerText=rupiah(p.price);
  document.getElementById("orderBox").classList.add("show");
};

window.nextPay=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.add("show");
};

window.closeAll=()=>{
  document.getElementById("orderBox").classList.remove("show");
  document.getElementById("payBox").classList.remove("show");
};
</script>

</body>
  </html>
