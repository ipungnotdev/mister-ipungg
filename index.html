<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040f;--bg2:#0e0820;--p1:#7c3aed;--p2:#a855f7;--p3:#c084fc;--p4:#e9d5ff;
  --gold:#f0c040;--white:#f3eeff;--muted:#9585b4;
  --card:rgba(124,58,237,0.09);--border:rgba(168,85,247,0.2);
  --font:'Outfit',sans-serif;--mono:'Space Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:var(--font);overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.o1{width:500px;height:500px;background:rgba(124,58,237,0.1);top:-100px;left:-150px}
.o2{width:400px;height:400px;background:rgba(168,85,247,0.07);bottom:0;right:-100px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:rgba(7,4,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-size:1.45rem;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(120deg,#c084fc,#f0c040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ham{display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
.ham span{display:block;width:24px;height:2.5px;background:var(--p3);border-radius:3px;transition:all .3s}
.ham.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.ham.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.ham.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}

/* DRAWER */
.drawer{position:fixed;top:62px;left:0;right:0;z-index:190;background:rgba(10,6,20,0.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:0.5rem 0 1.25rem;display:none;opacity:0}
.drawer.open{display:block;opacity:1}
.drawer-section{padding:1rem 1.25rem 0}
.drawer-label{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:0.75rem}
.wa-item{display:flex;align-items:center;gap:0.85rem;padding:0.85rem 1rem;border-radius:14px;background:rgba(37,211,102,0.06);border:1px solid rgba(37,211,102,0.15);text-decoration:none;margin-bottom:0.6rem;transition:background .2s}
.wa-item:hover{background:rgba(37,211,102,0.12)}
.wa-circle{width:40px;height:40px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wa-circle svg{width:22px;height:22px}
.wa-name{font-size:0.88rem;font-weight:800;color:#4ade80}
.wa-num{font-size:0.75rem;color:var(--muted);font-family:var(--mono)}
.ch-item{display:flex;align-items:center;gap:0.85rem;padding:0.85rem 1rem;border-radius:14px;background:rgba(37,99,235,0.07);border:1px solid rgba(37,99,235,0.18);text-decoration:none;margin-bottom:0.6rem;transition:background .2s}
.ch-item:hover{background:rgba(37,99,235,0.13)}
.ch-circle{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-circle svg{width:20px;height:20px;fill:#fff}
.ch-name{font-size:0.88rem;font-weight:800;color:#93c5fd}
.ch-sub{font-size:0.75rem;color:var(--muted)}

/* BANNER */
.banner-wrap{position:relative;z-index:1;margin-top:62px;height:200px;overflow:hidden}
.banner-track{display:flex;height:100%}
.bslide{flex-shrink:0;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bslide:nth-child(odd){background:linear-gradient(135deg,#140826 0%,#3b0764 55%,#140826 100%)}
.bslide:nth-child(even){background:linear-gradient(135deg,#0c0620 0%,#1e1b4b 55%,#3b0764 100%)}
.glow-blob{position:absolute;border-radius:50%;filter:blur(55px);pointer-events:none}
.gb1{width:280px;height:280px;background:rgba(139,92,246,0.28);top:-60px;left:5%}
.gb2{width:200px;height:200px;background:rgba(192,132,252,0.18);bottom:-40px;right:8%}
.bc{position:relative;z-index:2;text-align:center;padding:0 1.5rem}
.bc-eye{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--p3);margin-bottom:0.4rem}
.bc-title{font-size:clamp(1.3rem,5vw,2rem);font-weight:900;line-height:1.1;color:#fff;margin-bottom:0.3rem}
.bc-title span{color:var(--gold)}
.bc-sub{font-size:0.82rem;color:var(--p4);font-weight:500}
.bdots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.bdot{width:6px;height:6px;border-radius:50%;background:rgba(192,132,252,0.3);transition:background .3s,width .3s}
.bdot.on{background:var(--p3);width:18px;border-radius:3px}

/* HERO */
main{position:relative;z-index:1}
.wrap{max-width:700px;margin:0 auto;padding:0 1.25rem}
.hero{padding:3.5rem 1.25rem 2rem;max-width:700px;margin:0 auto;text-align:center}
.hero-tag{display:inline-flex;align-items:center;gap:0.5rem;padding:0.3rem 1rem;border-radius:999px;background:rgba(168,85,247,0.12);border:1px solid var(--border);font-size:0.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--p3);margin-bottom:1.2rem}
.hero h1{font-size:clamp(2rem,8vw,3.8rem);font-weight:900;line-height:1.05;letter-spacing:-1px;margin-bottom:1rem;background:linear-gradient(135deg,#fff 20%,var(--p3) 60%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:0.95rem;color:var(--muted);line-height:1.75;font-weight:500;max-width:480px;margin:0 auto 2rem}
.hero-cta{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.85rem;margin:2rem 0}
.scard{text-align:center;padding:1.5rem 0.5rem;background:var(--card);border:1px solid var(--border);border-radius:16px}
.snum{font-size:1.8rem;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,var(--p2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.slabel{font-size:0.7rem;color:var(--muted);font-weight:700;margin-top:0.2rem;text-transform:uppercase;letter-spacing:1px}

/* DEPLOY CARD */
.dcard{background:rgba(124,58,237,0.07);border:1px solid var(--border);border-radius:22px;padding:2rem 1.5rem;position:relative;overflow:hidden;margin-bottom:1.5rem}
.dcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--p2),transparent)}
.dcard-title{font-size:1.4rem;font-weight:900;letter-spacing:-0.5px;margin-bottom:1.5rem}
.dcard-title span{color:var(--p3)}
.deploy-row{display:flex;flex-direction:column;gap:0.85rem}
.input-wrap{position:relative}
.domain-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:0.85rem 1rem 0.85rem 3rem;color:var(--white);font-family:var(--font);font-size:1rem;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.domain-input::placeholder{color:rgba(156,163,175,0.4);font-weight:500}
.domain-input:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(168,85,247,0.14)}
.input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
.suffix-badge{padding:0.5rem 1rem;border-radius:10px;background:rgba(168,85,247,0.08);border:1px solid var(--border);font-size:0.8rem;font-weight:700;color:var(--p3);font-family:var(--mono);white-space:nowrap;text-align:center}
.prov-toggle{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.prov-btn{flex:1;padding:0.75rem 0;background:transparent;border:none;color:var(--muted);font-family:var(--font);font-size:0.85rem;font-weight:800;cursor:pointer;transition:background .2s,color .2s;letter-spacing:0.3px}
.prov-btn.active{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.prov-btn:not(.active):hover{background:rgba(168,85,247,0.1);color:var(--p3)}
.upload-label{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:0.5rem;display:block}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:1.75rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
.upload-zone:hover,.upload-zone.drag{border-color:var(--p2);background:rgba(168,85,247,0.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.uz-icon{font-size:2rem;margin-bottom:0.5rem}
.uz-main{font-size:0.9rem;font-weight:800;color:var(--white);margin-bottom:0.2rem}
.uz-sub{font-size:0.75rem;color:var(--muted);font-weight:500}
.fsel{display:none;align-items:center;gap:0.75rem;padding:0.8rem 1rem;background:rgba(168,85,247,0.07);border:1px solid var(--border);border-radius:12px;margin-top:0.75rem}
.fsel.show{display:flex}
.fname{font-size:0.85rem;font-weight:700}
.fsize{font-size:0.72rem;color:var(--muted)}
.domain-prev{padding:0.7rem 1rem;border-radius:10px;background:rgba(192,132,252,0.07);border:1px solid rgba(192,132,252,0.15);font-family:var(--mono);font-size:0.82rem;color:var(--p3);word-break:break-all;font-weight:700}

/* BUTTONS */
.btn-deploy{width:100%;padding:0.95rem;border-radius:13px;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-family:var(--font);font-size:1rem;font-weight:900;cursor:pointer;transition:transform .2s,box-shadow .2s;letter-spacing:0.3px;box-shadow:0 0 28px rgba(168,85,247,0.3)}
.btn-deploy:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(168,85,247,0.5)}
.btn-deploy:active{transform:scale(0.98)}
.btn-outline{padding:0.75rem 1.5rem;border-radius:12px;background:transparent;border:1px solid var(--border);color:var(--p4);font-family:var(--font);font-size:0.9rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
.btn-outline:hover{border-color:var(--p2);background:var(--card)}
.btn-solid{padding:0.75rem 1.5rem;border-radius:12px;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-family:var(--font);font-size:0.9rem;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s;box-shadow:0 0 20px rgba(168,85,247,0.3)}
.btn-solid:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(168,85,247,0.5)}

/* PROGRESS & STATUS */
.prog-wrap{display:none;margin-top:1rem}
.prog-wrap.show{display:block}
.prog-track{height:5px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p1),var(--p2),var(--gold));width:0%;transition:width .35s ease;box-shadow:0 0 10px rgba(168,85,247,0.6)}
.prog-info{display:flex;justify-content:space-between;margin-top:0.35rem;font-size:0.7rem;color:var(--muted);font-weight:700}
.sbar{display:none;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border-radius:12px;margin-top:0.85rem;font-size:0.85rem;font-weight:700}
.sbar.show{display:flex}
.sbar.loading{background:rgba(168,85,247,0.09);border:1px solid rgba(168,85,247,0.2);color:var(--p4)}
.sbar.ok{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:#86efac}
.sbar.err{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#fca5a5}
.spin{width:16px;height:16px;border:2px solid rgba(168,85,247,0.2);border-top-color:var(--p2);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none;margin-top:1rem;padding:1rem;background:rgba(168,85,247,0.07);border:1px solid var(--border);border-radius:14px}
.result.show{display:block}
.res-label{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:0.35rem}
.res-url{font-family:var(--mono);font-size:0.82rem;color:var(--p3);word-break:break-all;font-weight:700;margin-bottom:0.75rem}
.res-btns{display:flex;gap:0.6rem;flex-wrap:wrap}
.btn-sm{padding:0.4rem 1rem;border-radius:8px;font-size:0.78rem;font-weight:800;cursor:pointer;border:none;transition:.2s;font-family:var(--font)}
.bcopy{background:rgba(168,85,247,0.14);color:var(--p4)}
.bcopy:hover{background:rgba(168,85,247,0.25)}
.bopen{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.bopen:hover{opacity:.85}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2rem 1.25rem;text-align:center;position:relative;z-index:1}
.flogo{font-size:1.2rem;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(120deg,var(--p3),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.4rem}
.fsub{font-size:0.75rem;color:var(--muted);font-weight:600}

/* MUSIC */
.mbar{position:fixed;bottom:1rem;right:1rem;z-index:300;display:flex;align-items:center;gap:0.5rem;background:rgba(14,8,32,0.92);border:1px solid var(--border);border-radius:999px;padding:0.4rem 0.75rem 0.4rem 0.4rem;backdrop-filter:blur(24px);box-shadow:0 4px 20px rgba(0,0,0,0.5),0 0 14px rgba(168,85,247,0.1)}
.mplay{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;box-shadow:0 0 10px rgba(168,85,247,0.35);flex-shrink:0}
.mplay:hover{transform:scale(1.1);box-shadow:0 0 18px rgba(168,85,247,0.55)}
.mplay svg{width:12px;height:12px;fill:#fff}
.minfo{line-height:1.2}
.mtitle{font-size:0.65rem;font-weight:800;color:var(--white)}
.msub{font-size:0.58rem;color:var(--muted);font-weight:600}
.mwave{display:flex;align-items:center;gap:2px}
.mwave span{display:block;width:2.5px;border-radius:3px;background:var(--p3);animation:wave 1.1s ease-in-out infinite}
.mwave span:nth-child(1){height:6px;animation-delay:0s}
.mwave span:nth-child(2){height:11px;animation-delay:.18s}
.mwave span:nth-child(3){height:8px;animation-delay:.36s}
.mwave span:nth-child(4){height:13px;animation-delay:.09s}
.mwave span:nth-child(5){height:6px;animation-delay:.27s}
.mwave.paused span{animation-play-state:paused}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

section{padding:2.5rem 1.25rem}
</style>
</head>
<body>

<!-- Load config dulu sebelum apapun -->
<script src="config.js"></script>

<div class="orb o1"></div>
<div class="orb o2"></div>

<!-- NAV -->
<nav>
  <div class="logo" id="navLogo">⬡ Loading...</div>
  <button class="ham" id="ham" onclick="toggleDrawer()"><span></span><span></span><span></span></button>
</nav>

<!-- DRAWER (diisi JS dari config) -->
<div class="drawer" id="drawer"></div>

<!-- BANNER (diisi JS dari config) -->
<div class="banner-wrap">
  <div class="banner-track" id="bt"></div>
  <div class="bdots" id="bdots"></div>
</div>

<main>
  <div class="hero">
    <div class="hero-tag" id="heroTag"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroDesc"></p>
    <div class="hero-cta">
      <a href="#deploy" class="btn-solid">🚀 Mulai Deploy</a>
      <a href="#" class="btn-outline" id="ctaWa">💬 Hubungi Admin</a>
    </div>
    <div class="stats" id="statsRow"></div>
  </div>

  <section id="deploy">
    <div class="wrap">
      <div class="dcard">
        <div class="dcard-title">🚀 Deploy <span>Website Kamu</span></div>
        <div class="deploy-row">

          <div>
            <span class="upload-label">Provider Platform</span>
            <div class="prov-toggle" id="provToggle"></div>
          </div>

          <div>
            <span class="upload-label">Nama Domain Kamu</span>
            <div style="display:flex;gap:0.6rem;align-items:center">
              <div class="input-wrap" style="flex:1">
                <div class="input-icon">🌐</div>
                <input class="domain-input" id="dom" type="text" placeholder="contoh: ipungg" oninput="updDom()">
              </div>
              <div class="suffix-badge" id="sfx"></div>
            </div>
            <div class="domain-prev" id="dprev" style="margin-top:0.5rem"></div>
          </div>

          <div>
            <span class="upload-label">Upload File (HTML / ZIP)</span>
            <div class="upload-zone" id="uz">
              <input type="file" id="fi" accept=".html,.zip" onchange="onFile()">
              <div class="uz-icon">📁</div>
              <div class="uz-main">Klik atau drag & drop</div>
              <div class="uz-sub">.html atau .zip — maks 100MB</div>
            </div>
            <div class="fsel" id="fsel">
              <div id="fico" style="font-size:1.4rem">📄</div>
              <div><div class="fname" id="fn">—</div><div class="fsize" id="fs">—</div></div>
            </div>
          </div>

          <button class="btn-deploy" onclick="doDeploy()">🚀 Deploy Sekarang</button>
        </div>

        <div class="prog-wrap" id="pw">
          <div class="prog-track"><div class="prog-fill" id="pf"></div></div>
          <div class="prog-info"><span id="ps">Inisialisasi...</span><span id="pp">0%</span></div>
        </div>
        <div class="sbar" id="sb"><div class="spin" id="sp"></div><span id="sm">—</span></div>
        <div class="result" id="res">
          <div class="res-label">🎉 URL Berhasil</div>
          <div class="res-url" id="ru">—</div>
          <div class="res-btns">
            <button class="btn-sm bcopy" onclick="cpUrl()">📋 Copy</button>
            <a class="btn-sm bopen" id="ob" href="#" target="_blank">🌐 Buka Web</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="flogo" id="ftrLogo"></div>
  <div class="fsub" id="ftrSub"></div>
</footer>

<!-- MUSIC -->
<div class="mbar">
  <button class="mplay" id="mp" onclick="togMusic()">
    <svg id="mico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="minfo">
    <div class="mtitle">🎵 Music</div>
    <div class="msub" id="mst">▶ Play</div>
  </div>
  <div class="mwave paused" id="mw">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
<audio id="aud"></audio>

<script>
// =============================================
//  BOOT — semua dari CONFIG (config.js)
// =============================================
(function boot() {
  const C = CONFIG;

  // PAGE TITLE
  document.title = C.site.name + " — Premium Deploy Service";

  // NAV LOGO
  document.getElementById('navLogo').textContent = C.site.favicon + " " + C.site.name;

  // FOOTER
  document.getElementById('ftrLogo').textContent = C.site.favicon + " " + C.site.name;
  document.getElementById('ftrSub').textContent = C.site.footer;

  // HERO
  document.getElementById('heroTag').textContent = "⬡ " + C.site.tagline;
  document.getElementById('heroTitle').textContent = C.site.name;
  document.getElementById('heroDesc').textContent = C.site.description;

  // CTA WA (admin pertama)
  if (C.whatsapp.length > 0) {
    const w = C.whatsapp[0];
    document.getElementById('ctaWa').href =
      "https://wa.me/" + w.number + "?text=" + encodeURIComponent(w.pesan);
  }

  // STATS
  const sr = document.getElementById('statsRow');
  C.stats.forEach(s => {
    sr.innerHTML += `<div class="scard"><div class="snum">${s.num}</div><div class="slabel">${s.label}</div></div>`;
  });

  // DRAWER

  let drawerHtml = `<div class="drawer-section"><div class="drawer-label">💬 WhatsApp Admin</div>`;
  C.whatsapp.forEach(w => {

function setProgress(pct, msg) {
  document.getElementById('pf').style.width = pct + '%';
  document.getElementById('pp').textContent = pct + '%';
  document.getElementById('ps').textContent = msg;
  document.getElementById('sm').textContent = msg;
}

function setStatus(type, msg) {
  const sb = document.getElementById('sb');
  sb.className = 'sbar show ' + type;
  document.getElementById('sp').style.display = type === 'loading' ? 'block' : 'none';
  document.getElementById('sm').textContent = msg;
}

function showResult(url) {
  document.getElementById('ru').textContent = url;
  document.getElementById('ob').href = url;
  document.getElementById('res').classList.add('show');
}

async function doDeploy() {
  const provKey = window._prov;
  const prov = CONFIG.providers[provKey];
  const name = document.getElementById('dom').value.trim();
  const file = document.getElementById('fi').files[0];

  // ── Validasi input ──
  if (!name) {
    alert('⚠️ Isi nama domain dulu!'); return;
  }
  if (!/^[a-z0-9-]+$/.test(name)) {
    alert('⚠️ Nama domain hanya boleh huruf kecil, angka, dan tanda -'); return;
  }
  if (!file) {
    alert('⚠️ Pilih file HTML atau ZIP dulu!'); return;
  }
  if (!prov.token || prov.token.trim() === '') {
    alert('⚠️ Token ' + provKey + ' belum diisi di config.js!'); return;
  }

  // ── Reset UI ──
  document.getElementById('res').classList.remove('show');
  document.getElementById('pw').classList.add('show');
  document.getElementById('pf').style.width = '0%';
  setStatus('loading', 'Memulai deployment...');

  try {
    if (provKey === 'vercel') {
      await deployVercel(name, file, prov.token);
    } else if (provKey === 'netlify') {
      await deployNetlify(name, file, prov.token);
    }
  } catch (err) {
    setStatus('err', '❌ Gagal: ' + err.message);
    setProgress(0, 'Error');
  }
}

// ── VERCEL ──
async function deployVercel(name, file, token) {
  setProgress(10, 'Membaca file...');

  // Baca file jadi teks atau ArrayBuffer
  const isZip = file.name.endsWith('.zip');
  let files = [];

  if (isZip) {
    // Untuk ZIP: Vercel perlu file diekstrak — kita kirim ZIP as-is via file system upload
    // Vercel API v13 deployments — kirim file satu per satu
    // Untuk ZIP kita baca sebagai binary lalu hash
    const buf = await file.arrayBuffer();
    const hashBuf = await crypto.subtle.digest('SHA-1', buf);
    const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');

    setProgress(25, 'Upload file ke Vercel...');

    // Upload file
    const upRes = await fetch('https://api.vercel.com/v2/files', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/octet-stream',
        'x-vercel-digest': hash,
        'Content-Length': buf.byteLength,
      },
      body: buf,
    });
    if (!upRes.ok && upRes.status !== 200) {
      const e = await upRes.json().catch(() => ({}));
      throw new Error(e.error?.message || 'Upload file gagal (' + upRes.status + ')');
    }

    files = [{ file: 'index.html', sha: hash, size: buf.byteLength }];

    // Kalau ZIP sebenarnya perlu diekstrak — tapi Vercel tidak support ZIP langsung via API
    // Solusi: wrap ZIP content sebagai single HTML deployment
    // Untuk ZIP, kita beritahu user
    throw new Error('Vercel API tidak mendukung ZIP langsung. Gunakan file HTML tunggal untuk Vercel, atau pilih Netlify untuk ZIP.');

  } else {
    // HTML tunggal
    const text = await file.text();
    const encoder = new TextEncoder();
    const buf = encoder.encode(text);
    const hashBuf = await crypto.subtle.digest('SHA-1', buf);
    const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');

    setProgress(25, 'Upload file ke Vercel...');

    // Upload file ke Vercel
    const upRes = await fetch('https://api.vercel.com/v2/files', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'text/html',
        'x-vercel-digest': hash,
        'Content-Length': buf.byteLength,
      },
      body: buf,
    });

    // 200 = file sudah ada (cached), tetap lanjut
    if (!upRes.ok && upRes.status !== 200) {
      const e = await upRes.json().catch(() => ({}));
      throw new Error(e.error?.message || 'Upload file gagal (' + upRes.status + ')');
    }

    files = [{ file: 'index.html', sha: hash, size: buf.byteLength }];
  }

  setProgress(55, 'Membuat deployment di Vercel...');

  // Buat deployment
  const deployRes = await fetch('https://api.vercel.com/v13/deployments', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      name: name,
      files: files,
      projectSettings: { framework: null },
      target: 'production',
    }),
  });

  const deployData = await deployRes.json();
  if (!deployRes.ok) {
    throw new Error(deployData.error?.message || 'Deploy gagal (' + deployRes.status + ')');
  }

  setProgress(75, 'Menunggu build selesai...');

  // Poll status sampai ready
  const deployId = deployData.id;
  let finalUrl = deployData.url ? 'https://' + deployData.url : null;
  let tries = 0;

  while (tries < 30) {
    await sleep(3000);
    tries++;
    const checkRes = await fetch('https://api.vercel.com/v13/deployments/' + deployId, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const checkData = await checkRes.json();
    const state = checkData.status || checkData.readyState;

    if (state === 'READY') {
      finalUrl = 'https://' + (checkData.url || name + '.vercel.app');
      setProgress(100, 'Deploy berhasil! 🎉');
      setStatus('ok', '✅ Deploy sukses!');
      showResult(finalUrl);
      return;
    } else if (state === 'ERROR' || state === 'CANCELED') {
      throw new Error('Build gagal di Vercel. Cek dashboard Vercel kamu.');
    }

    const pct = Math.min(75 + tries * 0.8, 95);
    setProgress(pct, 'Build sedang berjalan... (' + tries + ')');
  }

  // Timeout tapi mungkin sudah jadi
  if (finalUrl) {
    setProgress(100, 'Selesai!');
    setStatus('ok', '✅ Cek URL di bawah (mungkin masih building)');
    showResult(finalUrl);
  } else {
    throw new Error('Timeout menunggu build. Cek dashboard Vercel.');
  }
}

// ── NETLIFY ──
async function deployNetlify(name, file, token) {
  setProgress(10, 'Membaca file...');

  const isZip = file.name.endsWith('.zip');
  let body, contentType;

  if (isZip) {
    // Netlify mendukung ZIP langsung!
    body = await file.arrayBuffer();
    contentType = 'application/zip';
  } else {
    // HTML tunggal — bungkus dalam ZIP sederhana tidak mudah tanpa library
    // Kita kirim sebagai raw body dengan content-type text/html
    // Netlify File Digest API: perlu ZIP. Kita buat ZIP minimal dari HTML.
    body = await file.arrayBuffer();
    contentType = 'application/zip';
    // Untuk HTML, kita buat ZIP manual
    body = await makeZipFromHtml(await file.text());
    contentType = 'application/zip';
  }

  setProgress(30, 'Membuat site di Netlify...');

  // Cek apakah site dengan nama ini sudah ada, kalau tidak buat baru
  let siteId = null;

  // Cari site yang sudah ada
  const listRes = await fetch('https://api.netlify.com/api/v1/sites?per_page=100', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if (listRes.ok) {
    const sites = await listRes.json();
    const existing = sites.find(s => s.name === name);
    if (existing) siteId = existing.id;
  }

  // Kalau belum ada, buat site baru
  if (!siteId) {
    const createRes = await fetch('https://api.netlify.com/api/v1/sites', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ name: name }),
    });
    const createData = await createRes.json();
    if (!createRes.ok) {
      throw new Error(createData.message || createData.errors?.join(', ') || 'Gagal buat site (' + createRes.status + ')');
    }
    siteId = createData.id;
  }

  setProgress(55, 'Upload & deploy ke Netlify...');

  // Deploy dengan ZIP
  const deployRes = await fetch('https://api.netlify.com/api/v1/sites/' + siteId + '/deploys', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': contentType,
    },
    body: body,
  });

  const deployData = await deployRes.json();
  if (!deployRes.ok) {
    throw new Error(deployData.message || deployData.errors?.join(', ') || 'Deploy gagal (' + deployRes.status + ')');
  }

  setProgress(75, 'Menunggu deploy selesai...');

  const deployId = deployData.id;
  let tries = 0;

  while (tries < 30) {
    await sleep(2500);
    tries++;
    const checkRes = await fetch('https://api.netlify.com/api/v1/deploys/' + deployId, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const checkData = await checkRes.json();

    if (checkData.state === 'ready') {
      const finalUrl = 'https://' + (checkData.ssl_url || checkData.url || name + '.netlify.app').replace('http://', '');
      setProgress(100, 'Deploy berhasil! 🎉');
      setStatus('ok', '✅ Deploy sukses!');
      showResult(finalUrl.startsWith('https://') ? finalUrl : 'https://' + finalUrl);
      return;
    } else if (checkData.state === 'error') {
      throw new Error('Build error di Netlify: ' + (checkData.error_message || 'Unknown error'));
    }

    const pct = Math.min(75 + tries, 95);
    setProgress(pct, 'Deploy sedang berjalan... (' + tries + ')');
  }

  throw new Error('Timeout. Cek dashboard Netlify kamu.');
}

// ── HELPER: buat ZIP minimal dari string HTML ──
async function makeZipFromHtml(htmlContent) {
  // Buat ZIP sederhana tanpa library eksternal
  // ZIP format: local file header + data + central directory + end of central dir
  const enc = new TextEncoder();
  const data = enc.encode(htmlContent);
  const filename = enc.encode('index.html');
  const now = new Date();
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);

  // CRC-32
  const crc = crc32(data);

  // Local file header
  const lfh = new Uint8Array([
    0x50,0x4B,0x03,0x04, // signature
    0x14,0x00,           // version needed
    0x00,0x00,           // flags
    0x00,0x00,           // compression (stored)
    dosTime & 0xFF, (dosTime >> 8) & 0xFF,
    dosDate & 0xFF, (dosDate >> 8) & 0xFF,
    crc & 0xFF, (crc >> 8) & 0xFF, (crc >> 16) & 0xFF, (crc >> 24) & 0xFF,
    data.length & 0xFF, (data.length >> 8) & 0xFF, (data.length >> 16) & 0xFF, (data.length >> 24) & 0xFF,
    data.length & 0xFF, (data.length >> 8) & 0xFF, (data.length >> 16) & 0xFF, (data.length >> 24) & 0xFF,
    filename.length & 0xFF, (filename.length >> 8) & 0xFF,
    0x00,0x00,
  ]);

  const localOffset = 0;
  const localSize = lfh.length + filename.length + data.length;

  // Central directory
  const cdr = new Uint8Array([
    0x50,0x4B,0x01,0x02,
    0x14,0x00,0x14,0x00,
    0x00,0x00,0x00,0x00,
    dosTime & 0xFF, (dosTime >> 8) & 0xFF,
    dosDate & 0xFF, (dosDate >> 8) & 0xFF,
    crc & 0xFF, (crc >> 8) & 0xFF, (crc >> 16) & 0xFF, (crc >> 24) & 0xFF,
    data.length & 0xFF, (data.length >> 8) & 0xFF, (data.length >> 16) & 0xFF, (data.length >> 24) & 0xFF,
    data.length & 0xFF, (data.length >> 8) & 0xFF, (data.length >> 16) & 0xFF, (data.length >> 24) & 0xFF,
    filename.length & 0xFF, (filename.length >> 8) & 0xFF,
    0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
    localOffset & 0xFF, (localOffset >> 8) & 0xFF, (localOffset >> 16) & 0xFF, (localOffset >> 24) & 0xFF,
  ]);

  // End of central dir
  const eocd = new Uint8Array([
    0x50,0x4B,0x05,0x06,
    0x00,0x00,0x00,0x00,
    0x01,0x00,0x01,0x00,
    (cdr.length + filename.length) & 0xFF, ((cdr.length + filename.length) >> 8) & 0xFF,
    ((cdr.length + filename.length) >> 16) & 0xFF, ((cdr.length + filename.length) >> 24) & 0xFF,
    localSize & 0xFF, (localSize >> 8) & 0xFF, (localSize >> 16) & 0xFF, (localSize >> 24) & 0xFF,
    0x00,0x00,
  ]);

  const zip = new Uint8Array(lfh.length + filename.length + data.length + cdr.length + filename.length + eocd.length);
  let off = 0;
  zip.set(lfh, off); off += lfh.length;
  zip.set(filename, off); off += filename.length;
  zip.set(data, off); off += data.length;
  zip.set(cdr, off); off += cdr.length;
  zip.set(filename, off); off += filename.length;
  zip.set(eocd, off);

  return zip.buffer;
}

function crc32(buf) {
  let c = 0xFFFFFFFF;
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let v = i;
      for (let j = 0; j < 8; j++) v = (v & 1) ? (0xEDB88320 ^ (v >>> 1)) : (v >>> 1);
      t[i] = v;
    }
    return t;
  })());
  for (let i = 0; i < buf.length; i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  navigator.clipboard.writeText(document.getElementById('ru').textContent).then(() => {
    const b = document.querySelector('.bcopy'); b.textContent = '✅ Disalin!';

  });
}
