<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05020f;
  --purple:#9b30ff;
  --neon:#bf5fff;
  --neon2:#00f5ff;
  --card:#0f0825;
  --border:rgba(155,48,255,0.3);
  --text:#f0e6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
}

/* NAV */
.navbar{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:9999;
  background:#070312;
  border-bottom:1px solid var(--border);
}

.logo-name{
  font-family:'Orbitron';
  color:var(--neon);
  font-weight:800;
}

.hamburger{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:rgba(155,48,255,.15);
  color:white;
  font-size:22px;
  cursor:pointer;
}

/* SIDE */
.side-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:9998;
}
.side-overlay.open{opacity:1;pointer-events:auto;}

.side-menu{
  position:fixed;
  top:0;
  right:-300px;
  width:280px;
  height:100%;
  background:#090312;
  transition:.3s;
  z-index:9999;
}
.side-menu.open{right:0;}

.side-links a{
  display:block;
  padding:14px;
  margin:10px;
  border-radius:12px;
  background:rgba(155,48,255,.08);
  color:white;
  text-decoration:none;
}

/* BANNER */
.banner-wrap img{
  width:100%;
  max-height:240px;
  object-fit:cover;
}

/* CATEGORY */
.cat-cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:12px;
}

.cat-card{
  min-width:150px;
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,rgba(155,48,255,.2),rgba(0,245,255,.05));
  border:1px solid rgba(155,48,255,.3);
  border-radius:18px;
  font-weight:800;
  cursor:pointer;
  transition:.3s;
}

.cat-card:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px rgba(155,48,255,.5);
}

/* PRODUCTS ANIMATED */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product-card{
  background:linear-gradient(145deg,#120822,#0b0515);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  animation:float 4s ease-in-out infinite;
  transition:.3s;
}

.product-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(155,48,255,.6);
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
  100%{transform:translateY(0);}
}

.prod-thumb{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

.prod-info{padding:12px;}

.btn-order{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10000;
}
.overlay.show{display:flex;}

.overlay-box{
  width:90%;
  max-width:400px;
  background:#0a0520;
  padding:20px;
  border-radius:16px;
}

.form-input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0515;
  color:white;
}

/* QRIS */
.qris-img{
  width:200px;
  margin:10px auto;
  display:block;
}

.btn-primary{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--neon2));
  color:white;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo-name" id="storeName">IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<div class="side-overlay" id="sideOverlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
  <div class="side-links">
    <a id="linkWa" target="_blank">WhatsApp</a>
    <a id="linkGroup" target="_blank">Grup</a>
    <a id="linkChannel" target="_blank">Channel</a>
  </div>
</div>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="cat-cards" id="catCards"></div>

<div class="products-grid" id="productsGrid"></div>

<!-- ORDER -->
<div class="overlay" id="orderOverlay">
  <div class="overlay-box">
    <h3>ORDER</h3>

    <div id="selProdName"></div>
    <div id="selProdPrice"></div>

    <input class="form-input" id="orderName" placeholder="Nama">
    <button class="btn-primary" onclick="submitOrder()">LANJUT PAYMENT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="paymentOverlay">
  <div class="overlay-box">

    <h3>PAYMENT QRIS</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qris-img">

    <input type="file" id="paymentProof" class="form-input">

    <button class="btn-primary" onclick="sendPaymentProof()">
      KIRIM BUKTI
    </button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyA9tSehgxD2Pgb7YPy7Pq-_bcuKLKswyos",
  authDomain:"ipung-store-2b96d.firebaseapp.com",
  databaseURL:"https://ipung-store-2b96d-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

window._data = {};

onValue(ref(db,"store"),(snap)=>{
  const d = snap.val()||{};
  window._data=d;

  document.getElementById("storeName").textContent=d.settings?.storeName||"IPUNGG SHOP";

  renderCats(d.categories||{});
  renderProds(d.products||{});
});

function renderCats(cats){
  document.getElementById("catCards").innerHTML =
  Object.values(cats).map(c=>
    `<div class="cat-card" onclick="filterCat('${c.name}')">${c.name}</div>`
  ).join('');
}

window.filterCat=function(cat){
  renderProds(window._data.products,cat);
};

function renderProds(p,cat="all"){
  const el=document.getElementById("productsGrid");
  let arr=Object.values(p||{});
  if(cat!=="all")arr=arr.filter(x=>x.category===cat);

  el.innerHTML=arr.map(x=>`
    <div class="product-card">
      <img class="prod-thumb" src="${x.thumbnail||''}">
      <div class="prod-info">
        <b>${x.name}</b><br>
        Rp ${Number(x.price).toLocaleString('id-ID')}
        <button class="btn-order" onclick='openOrder(${JSON.stringify(x)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.openOrder=function(p){
  window._p=p;
  document.getElementById("orderOverlay").classList.add("show");
  document.getElementById("selProdName").innerText=p.name;
  document.getElementById("selProdPrice").innerText=p.price;
};

window.submitOrder=function(){
  window._name=document.getElementById("orderName").value;
  document.getElementById("orderOverlay").classList.remove("show");
  document.getElementById("paymentOverlay").classList.add("show");
};

window.sendPaymentProof=async function(){

  const file=document.getElementById("paymentProof").files[0];
  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch("https://api.imgbb.com/1/upload?key=a8a4d55f889fcadd95552214d55c46b3",{method:"POST",body:fd});
  const json=await res.json();

  const img=json.data.url;

  const msg=encodeURIComponent(
`🛒 ORDER BARU

📦 Produk: ${window._p.name}
💰 Harga: Rp ${window._p.price}
👤 Nama: ${window._name}
📸 Bukti: ${img}`
  );

  window.open("https://wa.me/"+window._data.settings.urlAdmin+"?text="+msg);
};

window.toggleMenu=function(){
  document.getElementById("sideMenu").classList.toggle("open");
  document.getElementById("sideOverlay").classList.toggle("open");
};
</script>

</body>
      </html>
