<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#070312;
  color:white;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:12px 16px;
  background:#0b0618;
  border-bottom:1px solid #2d1a4b;
}

.logo{
  font-weight:bold;
  color:#bf5fff;
}

/* BANNER */
.banner img, .banner video{
  width:100%;
  max-height:180px;
  object-fit:cover;
}

/* CATEGORY */
.cat-wrap{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:10px;
}

.cat{
  min-width:120px;
  padding:10px;
  background:#120822;
  border:1px solid #2d1a4b;
  border-radius:10px;
  text-align:center;
}

/* PRODUCTS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#120822;
  border:1px solid #2d1a4b;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card .p{
  padding:10px;
}

/* ORDER / PAYMENT */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.overlay.show{
  display:flex;
}

.box{
  width:90%;
  max-width:360px;
  background:#0b0618;
  border:1px solid #2d1a4b;
  border-radius:12px;
  padding:15px;
}

.input{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#120822;
  border:1px solid #2d1a4b;
  color:white;
  border-radius:8px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#9b30ff;
  color:white;
}

/* QRIS */
.qr{
  width:170px;
  display:block;
  margin:10px auto;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">IPUNGG SHOP</div>
  <div onclick="toggleMenu()">☰</div>
</div>

<div class="banner" id="banner"></div>

<div class="cat-wrap">
  <div class="cat" onclick="filter('all')">Semua</div>
  <div id="cats"></div>
</div>

<div class="grid" id="products"></div>

<!-- ORDER -->
<div class="overlay" id="order">
  <div class="box">
    <h3>ORDER</h3>
    <input id="name" class="input" placeholder="Nama">
    <button class="btn" onclick="next()">LANJUT</button>
  </div>
</div>

<!-- PAYMENT -->
<div class="overlay" id="pay">
  <div class="box">
    <h3>PAYMENT</h3>

    <img src="http://rahmad-elaina.my.id/file/0ff97318b1.jpg" class="qr">

    <input type="file" class="input">

    <button class="btn" onclick="sendWA()">KIRIM WA</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"xxx",
  authDomain:"xxx",
  databaseURL:"xxx"
});

const db = getDatabase(app);

let data = {products:{},categories:{},settings:{}};
let selected = null;

/* 🔥 FIREBASE (TIDAK DIUBAH STRUKTUR) */
onValue(ref(db,"/"), (snap) => {
  const raw = snap.val() || {};

  data.products = raw.store?.products || raw.products || {};
  data.categories = raw.store?.categories || raw.categories || {};
  data.settings = raw.store?.settings || raw.settings || {};

  render();
});

function render(){

  /* BANNER */
  const b = document.getElementById("banner");
  const bn = data.settings?.banner;

  if(bn){
    b.innerHTML = bn.includes(".mp4")
      ? `<video autoplay muted loop src="${bn}"></video>`
      : `<img src="${bn}">`;
  }

  /* CATEGORY */
  const c = document.getElementById("cats");
  c.innerHTML = "";

  Object.values(data.categories).forEach(x=>{
    c.innerHTML += `<div class="cat">${x.name}</div>`;
  });

  /* PRODUCTS */
  const p = document.getElementById("products");
  const list = Object.values(data.products);

  if(list.length === 0){
    p.innerHTML = "<div style='padding:20px'>Belum ada produk</div>";
    return;
  }

  p.innerHTML = list.map(v=>`
    <div class="card">
      <img src="${v.thumbnail || ''}">
      <div class="p">
        <b>${v.name}</b><br>
        Rp ${Number(v.price).toLocaleString()}
        <button class="btn" onclick='order(${JSON.stringify(v)})'>ORDER</button>
      </div>
    </div>
  `).join('');
}

window.order = (p)=>{
  selected = p;
  document.getElementById("order").classList.add("show");
}

window.next = ()=>{
  document.getElementById("order").classList.remove("show");
  document.getElementById("pay").classList.add("show");
}

window.sendWA = ()=>{
  const msg = encodeURIComponent(
`🛒 ORDER IPUNGG SHOP

Nama : ${document.getElementById("name").value}
Produk : ${selected.name}
Harga : Rp ${selected.price}
Payment : QRIS`
  );

  window.open("https://wa.me/6285198959920?text="+msg);
}
</script>

</body>
</html>
